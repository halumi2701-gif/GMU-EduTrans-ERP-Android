name: GAWONE Customer RC15 P1 Closure

on:
  push:
    branches:
      - gawone-customer-production-build
    paths:
      - "gawone-customer-rc15-p1-closure.py"
      - ".github/workflows/gawone-customer-rc15-p1-closure.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct proven RC2 source
        shell: bash
        run: |
          cat gawone-customer-rc2-src.00 gawone-customer-rc2-src.01 gawone-customer-rc2-src.02 > /tmp/customer-rc2.b64
          base64 -d /tmp/customer-rc2.b64 > /tmp/customer-rc2.zip
          unzip -q /tmp/customer-rc2.zip
          test -f gawone-customer-production/app/build.gradle.kts
      - name: Apply proven RC3
        shell: bash
        run: |
          base64 -d gawone-customer-rc2-to-rc3.patch.gz.b64 | gunzip > /tmp/rc3.patch
          cd gawone-customer-production
          patch -p4 < /tmp/rc3.patch
          cd ..
          python gawone-customer-rc3-compile-fix.py
          python gawone-customer-rc3-static-hardening.py
      - name: Apply proven RC4 runtime gates
        shell: bash
        run: |
          base64 -d gawone-customer-rc3-to-rc4.patch.gz.b64 | gunzip > /tmp/rc4.patch
          patch -p1 < /tmp/rc4.patch
      - name: Apply cumulative RC5 to RC12
        shell: bash
        run: |
          python gawone-customer-rc5-e2e-pilot.py
          python gawone-customer-rc6-auth-fallback.py
          python gawone-customer-rc7-uiux-v2.py
          python gawone-customer-rc8-uiux-v3.py
          python gawone-customer-rc9-reliability.py
          python gawone-customer-rc10-nine-services.py
          python gawone-customer-rc11-five-service-canary.py
          python gawone-customer-rc12-mobility-foundation.py
      - name: Apply RC14 Business Mode and Labour
        run: python gawone-customer-rc14-business-labour.py
      - name: Apply RC15 P1 closure
        shell: bash
        run: |
          python gawone-customer-rc15-p1-closure.py
          grep -q 'versionCode = 24' gawone-customer-production/app/build.gradle.kts
          grep -q 'versionName = "1.0.14-p1-nine-services-complete-rc15"' gawone-customer-production/app/build.gradle.kts
          grep -q 'coverage_percent' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          grep -q 'delay(8000)' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          grep -q 'Labour 10–500 tenaga' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          grep -q 'MOBILITY' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          zip -qr GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_SOURCE.zip gawone-customer-production
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages from runner
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Lint and build RC15
        working-directory: gawone-customer-production
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify RC15 APK
        shell: bash
        run: |
          APK=gawone-customer-production/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15.apk
          unzip -t GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15.apk >/dev/null
          sha256sum GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15.apk | tee GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15.apk > GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_BADGING.txt
          grep -q "package: name='site.garsyanimultiusaha.gawone' versionCode='24' versionName='1.0.14-p1-nine-services-complete-rc15'" GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15.apk > GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_SIGNATURE.txt
          test -f gawone-customer-production/app/build/reports/lint-results-release.html
      - uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15
          if-no-files-found: error
          retention-days: 14
          path: |
            GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15.apk
            GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_SHA256.txt
            GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_SOURCE.zip
            GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_BADGING.txt
            GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_SIGNATURE.txt
            gawone-customer-production/app/build/reports/lint-results-release.html

  emulator_smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15
      - name: Prepare RC15 smoke script
        shell: bash
        run: |
          mkdir -p emulator-reports
          sed -e 's/GAWONE_Customer_v1.0.3_RC4.apk/GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15.apk/g' -e 's/RC4 emulator production-prep gate/RC15 P1 closure emulator gate/g' gawone-customer-emulator-smoke.sh > /tmp/gawone-customer-rc15-smoke.sh
          chmod +x /tmp/gawone-customer-rc15-smoke.sh
      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: RC15 Android emulator gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-window -dns-server 8.8.8.8
          script: bash /tmp/gawone-customer-rc15-smoke.sh
      - name: Upload RC15 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.14_P1_NINE_SERVICES_COMPLETE_RC15_EMULATOR_GATE
          if-no-files-found: warn
          retention-days: 90
          path: emulator-reports
