name: Deploy GMU ERP Current Main Once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/deploy-current-main-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmu-edutrans-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: gtgnwasijweewmaubvyg
  ERP_LIVE_URL: https://erp.edutrans.garsyanimultiusaha.site/
  VERCEL_ORG_ID: team_eb0gRoeVYnxOU49hZdWSUqYF
  VERCEL_PROJECT_ID: prj_3enHdsSqMjcLHQCcXPLyZI8UXS9Q

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4

      - name: Validate current main release contracts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find erp-web -type f -name '*.js' -print0)
          node --check scripts/build-erp-web-v10-release.js
          node --check scripts/build-erp-web-v221-supplement.js
          node scripts/verify-erp-web-media.js
          node scripts/verify-erp-web-v10.js
          node scripts/verify-erp-web-v21.js
          node scripts/verify-erp-web-v212.js
          node scripts/verify-erp-web-v213.js
          node scripts/verify-erp-web-v214.js
          test -f supabase/migrations/20260915171000_gmu_v219_program_master_six_programs.sql
          test -f supabase/migrations/20260915173000_gmu_v220_customer_account_crm.sql
          test -f supabase/migrations/20260915181000_gmu_v221_portfolio_target_train_packages.sql
          test -f supabase/migrations/20260915182000_gmu_v222_sales_portfolio_safe_rpc.sql
          test -f supabase/migrations/20260915182500_gmu_v223_portfolio_view_privacy.sql
          test -f supabase/migrations/20260915185000_gmu_v224_legacy_program_slug_normalization.sql
          test -f supabase/migrations/20260915189000_gmu_v224_pricing_master_preflight.sql
          test -f supabase/migrations/20260915190000_gmu_v224_master_program_pricing_engine.sql
          test -f supabase/migrations/20260917193000_gmu_v226_sales_public_b2b_unified_pricing.sql
          grep -Fq 'ALL_PROGRAMS' supabase/migrations/20260915181000_gmu_v221_portfolio_target_train_packages.sql
          grep -Fq 'gmu_sales_portfolio_summary' supabase/migrations/20260915182000_gmu_v222_sales_portfolio_safe_rpc.sql
          grep -Fq '25%' docs/GMU_V224_MASTER_PROGRAM_PRICING_ENGINE.md
          grep -Fq 'STATION-PROF-2026' supabase/migrations/20260917193000_gmu_v226_sales_public_b2b_unified_pricing.sql
          grep -Fq 'train-package-policy-v221.js' erp-web/unified-v10-loader.js

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN belum tersedia."; exit 1; }
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN belum tersedia."; exit 1; }

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: v2.117.0

      - name: Link exact production database
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref "$SUPABASE_PROJECT_ID"
          fi
          supabase migration list

      - name: Dry-run all pending production migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run

      - name: Apply all pending production migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push

      - name: Build current ERP release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-erp-web-v10-release.js
          node scripts/build-erp-web-v221-supplement.js
          test -f dist/erp-web-v10/index.html
          test -f dist/erp-web-v10/release-manifest.json
          test -f dist/erp-web-v10/station-target-v216.js
          test -f dist/erp-web-v10/sales-target-v217.js
          test -f dist/erp-web-v10/station-operating-policy-v218.js
          test -f dist/erp-web-v10/customer-account-crm-v220.js
          test -f dist/erp-web-v10/train-package-policy-v221.js
          grep -Fq 'v22.2-sales-portfolio-target-safe' dist/erp-web-v10/sales-target-v217.js
          grep -Fq 'Customer Account & Prospek Web' dist/erp-web-v10/customer-account-crm-v220.js
          grep -Fq 'HPP fasilitas • LOCK' dist/erp-web-v10/train-package-policy-v221.js

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Link exact ERP Vercel project
        working-directory: dist/erp-web-v10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy current main to production
        id: deploy
        working-directory: dist/erp-web-v10
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --yes --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      - name: Verify deployment URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL" -o /tmp/erp-current.html
          grep -Fq 'GMU EduTrans ERP v21' /tmp/erp-current.html
          grep -Fq 'src="./unified-v10-loader.js"' /tmp/erp-current.html
          for file in sales-target-v217.js station-target-v216.js customer-account-crm-v220.js train-package-policy-v221.js; do
            curl --fail --silent --show-error --location "$DEPLOYMENT_URL/$file" -o "/tmp/$file"
          done
          grep -Fq 'v22.2-sales-portfolio-target-safe' /tmp/sales-target-v217.js
          grep -Fq 'v22.1-station-pricing-policy' /tmp/station-target-v216.js
          grep -Fq 'v22.0-customer-account-crm' /tmp/customer-account-crm-v220.js
          grep -Fq 'v22.1-train-package-policy' /tmp/train-package-policy-v221.js

      - name: Verify production custom domain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$ERP_LIVE_URL" -o /tmp/erp-prod.html
          grep -Fq 'GMU EduTrans ERP v21' /tmp/erp-prod.html
          grep -Fq 'src="./unified-v10-loader.js"' /tmp/erp-prod.html
          for file in sales-target-v217.js station-target-v216.js customer-account-crm-v220.js train-package-policy-v221.js; do
            curl --fail --silent --show-error --location "${ERP_LIVE_URL}$file" -o "/tmp/prod-$file"
          done
          grep -Fq 'v22.2-sales-portfolio-target-safe' /tmp/prod-sales-target-v217.js
          grep -Fq 'v22.1-station-pricing-policy' /tmp/prod-station-target-v216.js
          grep -Fq 'v22.0-customer-account-crm' /tmp/prod-customer-account-crm-v220.js
          grep -Fq 'v22.1-train-package-policy' /tmp/prod-train-package-policy-v221.js
          echo "GMU EduTrans current-main production verification: PASS"

      - name: Production summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "GMU EduTrans current main deployed and verified."
          echo "Production: $ERP_LIVE_URL"
          echo "Deployment: $DEPLOYMENT_URL"
          echo "Database: all pending migrations through v22.6 applied."
          echo "Sales pricing: PUBLIC + B2B unified from master pricing engine."
          echo "Sales target: 200 paid pax/month across all programs."
