name: Build PAMOYANAN ONE V20

on:
  push:
    branches:
      - pamoyanan-v20-production
    paths:
      - "pamoyanan-native-v4/**"
      - ".github/workflows/pamoyanan-v20.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build V20 APK
        working-directory: pamoyanan-native-v4
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp pamoyanan-native-v4/app/build/outputs/apk/debug/app-debug.apk artifact/PAMOYANAN_ONE_v20.2.4_V20.apk
          sha256sum artifact/PAMOYANAN_ONE_v20.2.4_V20.apk | tee artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PAMOYANAN_ONE_V20_2_4
          path: artifact/
          if-no-files-found: error
          retention-days: 7
