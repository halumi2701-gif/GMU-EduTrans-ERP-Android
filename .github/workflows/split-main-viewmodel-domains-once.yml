name: One-time MainViewModel Domain Split

on:
  push:
    paths:
      - '.github/workflows/split-main-viewmodel-domains-once.yml'
      - 'scripts/split-main-viewmodel-domains.py'

permissions:
  contents: write

jobs:
  split-domain-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Split MainViewModel actions by domain
        run: python3 scripts/split-main-viewmodel-domains.py

      - name: Verify domain boundaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT='app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp'
          test -f "$ROOT/SalesActions.kt"
          test -f "$ROOT/CommerceActions.kt"
          test -f "$ROOT/FinanceActions.kt"
          test -f "$ROOT/OperationsActions.kt"
          test -f "$ROOT/PeopleActions.kt"
          grep -q 'fun MainViewModel.createBooking' "$ROOT/SalesActions.kt"
          grep -q 'fun MainViewModel.publishQuotation' "$ROOT/CommerceActions.kt"
          grep -q 'fun MainViewModel.savePlanningTarget' "$ROOT/FinanceActions.kt"
          grep -q 'fun MainViewModel.insert' "$ROOT/OperationsActions.kt"
          grep -q 'fun MainViewModel.createStaff' "$ROOT/PeopleActions.kt"

      - name: Compile Kotlin debug
        run: gradle --no-daemon compileDebugKotlin

      - name: Commit domain split
        shell: bash
        run: |
          git config user.name 'GMU EduTrans Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/MainViewModel.kt \
                  app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/SalesActions.kt \
                  app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/CommerceActions.kt \
                  app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/FinanceActions.kt \
                  app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/OperationsActions.kt \
                  app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/PeopleActions.kt
          git commit -m 'refactor(android): split MainViewModel actions by domain'
          git push origin HEAD:main
