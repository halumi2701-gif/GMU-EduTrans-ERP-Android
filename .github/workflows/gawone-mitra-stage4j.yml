name: GAWONE Mitra Legacy RC5 Compile

on:
  push:
    branches: [gawone-mitra-stage4j-build]
    paths:
      - "gawone-mitra-stage4j-rc3-pilot.py"
      - "gawone-mitra-stage4j-rc3-static.py"
      - "gawone-mitra-stage4j-rc4-reliability.py"
      - "gawone-mitra-stage4j-rc5-nine-services.py"
      - "gawone-stage4j-rc2-patch.b64"
      - "gawone-stage4j-source.part*"
      - ".github/workflows/gawone-mitra-stage4j.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Historical RC5 reconstruction/compile only. Current emulator coverage lives in RC6 P2 Final.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Stage 4J source
        shell: bash
        run: |
          cat gawone-stage4j-source.part00 gawone-stage4j-source.part01 gawone-stage4j-source.part02 gawone-stage4j-source.part03 gawone-stage4j-source.part04 > /tmp/gawone-stage4j-source.b64
          base64 -d /tmp/gawone-stage4j-source.b64 > /tmp/gawone-stage4j-source.zip
          unzip -q /tmp/gawone-stage4j-source.zip
          test -f gawone-mitra-stage4j/app/build.gradle.kts
      - name: Apply cumulative RC2 to RC5
        shell: bash
        run: |
          base64 -d gawone-stage4j-rc2-patch.b64 > /tmp/rc2.py
          python /tmp/rc2.py gawone-mitra-stage4j
          python gawone-mitra-stage4j-rc3-pilot.py gawone-mitra-stage4j
          python gawone-mitra-stage4j-rc3-static.py gawone-mitra-stage4j
          python gawone-mitra-stage4j-rc4-reliability.py gawone-mitra-stage4j
          python gawone-mitra-stage4j-rc5-nine-services.py gawone-mitra-stage4j
          grep -q 'versionCode = 14' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'versionName = "1.0.4-stage4j-nine-services-rc5"' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'partnerEligibleServiceCodes' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/MainActivity.kt
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Static QA and compile
        working-directory: gawone-mitra-stage4j
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify RC5 APK
        shell: bash
        run: |
          APK=gawone-mitra-stage4j/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" /tmp/GAWONE_Mitra_RC5.apk
          unzip -t /tmp/GAWONE_Mitra_RC5.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/GAWONE_Mitra_RC5.apk | grep -q "package: name='site.garsyanimultiusaha.gawone.mitra' versionCode='14' versionName='1.0.4-stage4j-nine-services-rc5'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose /tmp/GAWONE_Mitra_RC5.apk >/dev/null
