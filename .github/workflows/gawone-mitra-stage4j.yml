name: GAWONE Mitra Stage 4J Reliability RC4

on:
  push:
    branches:
      - gawone-mitra-stage4j-build
    paths:
      - "gawone-mitra-stage4j-rc3-pilot.py"
      - "gawone-mitra-stage4j-rc3-static.py"
      - "gawone-mitra-stage4j-rc4-reliability.py"
      - "gawone-stage4j-rc2-patch.b64"
      - "gawone-stage4j-source.part*"
      - "gawone-mitra-emulator-smoke.sh"
      - ".github/workflows/gawone-mitra-stage4j.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct GAWONE Stage 4J source
        shell: bash
        run: |
          cat gawone-stage4j-source.part00 gawone-stage4j-source.part01 gawone-stage4j-source.part02 gawone-stage4j-source.part03 gawone-stage4j-source.part04 > gawone-stage4j-source.b64
          base64 -d gawone-stage4j-source.b64 > gawone-stage4j-source.zip
          unzip -q gawone-stage4j-source.zip
          test -f gawone-mitra-stage4j/app/build.gradle.kts

      - name: Apply proven RC2 hardening
        shell: bash
        run: |
          base64 -d gawone-stage4j-rc2-patch.b64 > gawone-stage4j-rc2-patch.py
          python gawone-stage4j-rc2-patch.py gawone-mitra-stage4j
          grep -q 'versionCode = 11' gawone-mitra-stage4j/app/build.gradle.kts

      - name: Apply controlled-pilot RC3 hardening
        shell: bash
        run: |
          python gawone-mitra-stage4j-rc3-pilot.py gawone-mitra-stage4j
          python gawone-mitra-stage4j-rc3-static.py gawone-mitra-stage4j
          grep -q 'versionCode = 12' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'versionName = "1.0.2-stage4j-pilot-rc3"' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'BuildConfig.VERSION_CODE' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/MainActivity.kt
          grep -q 'runtimeFeatureEnabled(runtime, "OFFER")' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/MainActivity.kt
          grep -q 'runtimeFeatureEnabled(runtime, "JOB_EXECUTION")' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/MainActivity.kt
          grep -q 'android:icon="@mipmap/ic_launcher"' gawone-mitra-stage4j/app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' gawone-mitra-stage4j/app/src/main/AndroidManifest.xml

      - name: Apply Reliability RC4 safe error UX
        shell: bash
        run: |
          python gawone-mitra-stage4j-rc4-reliability.py gawone-mitra-stage4j
          grep -q 'versionCode = 13' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'versionName = "1.0.3-stage4j-reliability-rc4"' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'object GawoneMitraFailureMapper' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/GawoneMitraFailure.kt
          grep -q 'OFFER_EXPIRED' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/GawoneMitraFailure.kt
          grep -q 'PARTNER_PRESENCE_STALE' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/GawoneMitraFailure.kt
          grep -q 'COMPLETION_PROOF_REQUIRED' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/GawoneMitraFailure.kt
          grep -q 'PERMISSION DENIED FOR TABLE' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/GawoneMitraFailure.kt
          zip -qr GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_SOURCE.zip gawone-mitra-stage4j

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Static QA and compile
        working-directory: gawone-mitra-stage4j
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify Reliability RC4 APK
        shell: bash
        run: |
          APK=gawone-mitra-stage4j/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4.apk
          unzip -t GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4.apk >/dev/null
          sha256sum GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4.apk | tee GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4.apk > GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_BADGING.txt
          grep -q "package: name='site.garsyanimultiusaha.gawone.mitra' versionCode='13' versionName='1.0.3-stage4j-reliability-rc4'" GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4.apk > GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_SIGNATURE.txt
          test -f gawone-mitra-stage4j/app/build/reports/lint-results-release.html

      - uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4
          if-no-files-found: error
          retention-days: 14
          path: |
            GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4.apk
            GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_SHA256.txt
            GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_SOURCE.zip
            GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_BADGING.txt
            GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_SIGNATURE.txt
            gawone-mitra-stage4j/app/build/reports/lint-results-release.html

  emulator_smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4

      - name: Prepare emulator reports
        shell: bash
        run: mkdir -p emulator-reports

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Reliability RC4 Android emulator gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-window -dns-server 8.8.8.8
          script: bash gawone-mitra-emulator-smoke.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Mitra_v1.0.3_STAGE4J_RELIABILITY_RC4_EMULATOR_GATE
          if-no-files-found: warn
          path: emulator-reports
