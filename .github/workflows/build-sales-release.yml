name: Build GMU EduTrans Sales Release

on:
  push:
    branches: [ "sales-app-v1" ]
    paths:
      - "sales-app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-sales-release.yml"
  workflow_dispatch:

jobs:
  release-sales:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Use exact GMU EduTrans logo
        shell: bash
        run: |
          set -euo pipefail
          rm -f sales-app/src/main/res/drawable/sales_logo.xml
          curl -fsSL "https://gtgnwasijweewmaubvyg.supabase.co/functions/v1/gmu-logo" \
            -o sales-app/src/main/res/drawable/sales_logo.jpg
          file sales-app/src/main/res/drawable/sales_logo.jpg

      - name: Reject WebView usage
        shell: bash
        run: |
          if grep -R "android.webkit.WebView\|<WebView" -n sales-app/src/main; then
            echo "WebView is forbidden in GMU EduTrans Sales App"
            exit 1
          fi

      - name: Build Sales release APK
        run: gradle --no-daemon :sales-app:assembleRelease

      - name: Verify unsigned release APK
        run: |
          test -f sales-app/build/outputs/apk/release/sales-app-release-unsigned.apk
          ls -lh sales-app/build/outputs/apk/release/sales-app-release-unsigned.apk

      - name: Sign release when GMU signing secrets are configured
        env:
          SALES_KEYSTORE_B64: ${{ secrets.SALES_KEYSTORE_B64 }}
          SALES_KEYSTORE_PASSWORD: ${{ secrets.SALES_KEYSTORE_PASSWORD }}
          SALES_KEY_ALIAS: ${{ secrets.SALES_KEY_ALIAS }}
          SALES_KEY_PASSWORD: ${{ secrets.SALES_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out
          UNSIGNED="sales-app/build/outputs/apk/release/sales-app-release-unsigned.apk"
          if [[ -n "${SALES_KEYSTORE_B64:-}" && -n "${SALES_KEYSTORE_PASSWORD:-}" && -n "${SALES_KEY_ALIAS:-}" && -n "${SALES_KEY_PASSWORD:-}" ]]; then
            echo "$SALES_KEYSTORE_B64" | base64 --decode > /tmp/gmu-sales-release.jks
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -f 4 "$UNSIGNED" release-out/GMU-EduTrans-Sales-v6.4.0-aligned.apk
            "$BT/apksigner" sign \
              --ks /tmp/gmu-sales-release.jks \
              --ks-pass "pass:$SALES_KEYSTORE_PASSWORD" \
              --ks-key-alias "$SALES_KEY_ALIAS" \
              --key-pass "pass:$SALES_KEY_PASSWORD" \
              --out release-out/GMU-EduTrans-Sales-v6.4.0-release.apk \
              release-out/GMU-EduTrans-Sales-v6.4.0-aligned.apk
            "$BT/apksigner" verify --verbose --print-certs release-out/GMU-EduTrans-Sales-v6.4.0-release.apk
            rm -f release-out/GMU-EduTrans-Sales-v6.4.0-aligned.apk /tmp/gmu-sales-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp "$UNSIGNED" release-out/GMU-EduTrans-Sales-v6.4.0-unsigned.apk
            echo "Signing secrets are not configured; publishing unsigned release candidate only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
        id: signing

      - name: Upload Sales release candidate
        uses: actions/upload-artifact@v4
        with:
          name: GMU-EduTrans-Sales-v6.4.0-release-candidate
          path: release-out/*.apk
          if-no-files-found: error
          retention-days: 14
