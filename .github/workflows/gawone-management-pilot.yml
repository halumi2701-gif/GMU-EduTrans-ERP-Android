name: GAWONE Management Pilot M0

on:
  push:
    branches: [ gawone-management-pilot-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Management M0 source
        shell: bash
        run: |
          cat gawone-management-m0.small00 gawone-management-m0.small01 gawone-management-m0.small02 gawone-management-m0.small03 gawone-management-m0.small04 gawone-management-m0.small05 gawone-management-m0.small06 gawone-management-m0.small07 > gawone-management-m0-source.b64
          test "$(wc -c < gawone-management-m0-source.b64)" -eq 25152
          base64 -d gawone-management-m0-source.b64 > gawone-management-m0-source.zip
          unzip -t gawone-management-m0-source.zip >/dev/null
          unzip -q gawone-management-m0-source.zip
          test -f gawone-management-pilot/app/build.gradle.kts
          grep -q 'applicationId = "site.garsyanimultiusaha.gawone.management"' gawone-management-pilot/app/build.gradle.kts
          grep -q 'versionCode = 1' gawone-management-pilot/app/build.gradle.kts
          grep -q 'versionName = "0.1.0-pilot-m0"' gawone-management-pilot/app/build.gradle.kts
          grep -q 'AndroidKeyStore' gawone-management-pilot/app/src/main/java/site/garsyanimultiusaha/gawone/management/SessionStore.kt
          grep -q 'Aplikasi tidak membawa service-role key' gawone-management-pilot/app/src/main/java/site/garsyanimultiusaha/gawone/management/MainActivity.kt
          if grep -R -n "service_role" gawone-management-pilot/app/src/main/java; then echo 'Privileged secret marker found in Android source' >&2; exit 1; fi
          zip -qr GAWONE_Management_v0.1.0_PILOT_M0_SOURCE.zip gawone-management-pilot

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Static QA and compile
        working-directory: gawone-management-pilot
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify Management M0 APK
        shell: bash
        run: |
          APK=gawone-management-pilot/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" GAWONE_Management_v0.1.0_PILOT_M0.apk
          unzip -t GAWONE_Management_v0.1.0_PILOT_M0.apk >/dev/null
          sha256sum GAWONE_Management_v0.1.0_PILOT_M0.apk | tee GAWONE_Management_v0.1.0_PILOT_M0_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GAWONE_Management_v0.1.0_PILOT_M0.apk > GAWONE_Management_v0.1.0_PILOT_M0_BADGING.txt
          grep -q "package: name='site.garsyanimultiusaha.gawone.management' versionCode='1' versionName='0.1.0-pilot-m0'" GAWONE_Management_v0.1.0_PILOT_M0_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GAWONE_Management_v0.1.0_PILOT_M0.apk > GAWONE_Management_v0.1.0_PILOT_M0_SIGNATURE.txt
          test -f gawone-management-pilot/app/build/reports/lint-results-release.html

      - uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Management_v0.1.0_PILOT_M0
          if-no-files-found: error
          path: |
            GAWONE_Management_v0.1.0_PILOT_M0.apk
            GAWONE_Management_v0.1.0_PILOT_M0_SHA256.txt
            GAWONE_Management_v0.1.0_PILOT_M0_SOURCE.zip
            GAWONE_Management_v0.1.0_PILOT_M0_BADGING.txt
            GAWONE_Management_v0.1.0_PILOT_M0_SIGNATURE.txt
            gawone-management-pilot/app/build/reports/lint-results-release.html

  emulator_smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GAWONE_Management_v0.1.0_PILOT_M0

      - name: Prepare emulator reports
        shell: bash
        run: mkdir -p emulator-reports

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Management M0 Android emulator gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-window -dns-server 8.8.8.8
          script: bash gawone-management-emulator-smoke.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Management_v0.1.0_PILOT_M0_EMULATOR_GATE
          if-no-files-found: warn
          path: emulator-reports
