name: Build PAMOYANAN ONE V4 APK

on:
  push:
    branches:
      - pamoyanan-v4-apk-build
    paths:
      - "pamoyanan-v4-shell/**"
      - ".github/workflows/pamoyanan-v4-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: pamoyanan-v4-shell
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp pamoyanan-v4-shell/app/build/outputs/apk/debug/app-debug.apk artifact/PAMOYANAN_ONE_v6.7.1_V4.apk
          sha256sum artifact/PAMOYANAN_ONE_v6.7.1_V4.apk | tee artifact/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAMOYANAN_ONE_V4_APK
          path: artifact/
          if-no-files-found: error
          retention-days: 7
