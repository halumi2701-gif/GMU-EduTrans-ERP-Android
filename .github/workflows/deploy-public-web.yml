name: Deploy GMU EduTrans Public Web

on:
  push:
    branches: ["main"]
    paths:
      - "public-web/**"
      - ".github/workflows/deploy-public-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmu-edutrans-public-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_eb0gRoeVYnxOU49hZdWSUqYF
  VERCEL_PROJECT_ID: prj_qxr1xYZmK8FnGmYMquLJxw8KEJzH
  PUBLIC_LIVE_URL: https://edutrans.garsyanimultiusaha.site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate public recruitment page
        shell: bash
        run: |
          set -euo pipefail
          test -f public-web/index.html
          test -f public-web/recruitment.html
          test -f public-web/api/proxy.js
          test -f public-web/manifest.webmanifest
          grep -Fq 'Educational Trip & Educational Tourism Operator' public-web/index.html
          grep -Fq 'Recruitment GMU EduTrans' public-web/recruitment.html
          grep -Fq 'gmu_public_recruitment_submit' public-web/recruitment.html
          grep -Fq 'Admin Part Time' public-web/recruitment.html
          grep -Fq 'Finance Part Time' public-web/recruitment.html
          grep -Fq 'Marketing & Sales' public-web/recruitment.html
          grep -Fq 'Operasional Freelance' public-web/recruitment.html
          grep -Fq 'TL / MC / Edukator' public-web/recruitment.html
          grep -Fq 'Dokumentasi Freelance' public-web/recruitment.html
          grep -Fq 'Helper Freelance' public-web/recruitment.html
          grep -Fq 'Pendidikan minimal SMA/SMK/MA' public-web/recruitment.html
          grep -Fq 'name="experience_years"' public-web/recruitment.html
          grep -Fq 'gmu-public-recruitment-v2' supabase/migrations/20261002133000_gmu_v2337_public_recruitment_hardening.sql
          ! grep -Fq '<option>SMP</option>' public-web/recruitment.html
          ! grep -Fq 'barren-inexperienced-websphere--garsyanimultius.replit.app' public-web/recruitment.html

      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Link exact public Vercel project
        shell: bash
        working-directory: public-web
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error title=Vercel production credential missing::Add repository/environment secret VERCEL_TOKEN, then rerun this workflow."; exit 1; }
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy public web production
        id: deploy
        shell: bash
        working-directory: public-web
        run: |
          set -euo pipefail
          url="$(vercel deploy --yes --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      - name: Verify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL/" -o /tmp/home.html
          grep -Fq 'Educational Trip & Educational Tourism Operator' /tmp/home.html
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL/recruitment" -o /tmp/recruitment.html
          grep -Fq 'Recruitment GMU EduTrans' /tmp/recruitment.html
          grep -Fq 'gmu_public_recruitment_submit' /tmp/recruitment.html
          grep -Fq 'name="experience_years"' /tmp/recruitment.html
          curl --fail --silent --show-error --location "$PUBLIC_LIVE_URL/recruitment" -o /tmp/recruitment-live.html
          grep -Fq 'Recruitment GMU EduTrans' /tmp/recruitment-live.html
          grep -Fq 'gmu_public_recruitment_submit' /tmp/recruitment-live.html
          grep -Fq 'Pendidikan minimal SMA/SMK/MA' /tmp/recruitment-live.html
          grep -Fq 'name="experience_years"' /tmp/recruitment-live.html
          ! grep -Fq 'Educational Trip & Educational Tourism Operator' /tmp/recruitment-live.html

      - name: Summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "GMU EduTrans public web deployed."
          echo "Live recruitment: $PUBLIC_LIVE_URL/recruitment"
          echo "Deployment: $DEPLOYMENT_URL"
