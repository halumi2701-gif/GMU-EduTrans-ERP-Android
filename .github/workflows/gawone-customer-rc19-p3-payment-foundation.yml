name: GAWONE Customer RC19 P3 Payment Foundation
on:
  push:
    branches: [gawone-customer-production-build]
    paths:
      - "gawone-customer-rc19-p3-payment-foundation.py"
      - "gawone-customer-rc19-emulator-smoke.sh"
      - ".github/workflows/gawone-customer-rc19-p3-payment-foundation.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct proven RC2 source
        shell: bash
        run: |
          cat gawone-customer-rc2-src.00 gawone-customer-rc2-src.01 gawone-customer-rc2-src.02 > /tmp/customer-rc2.b64
          base64 -d /tmp/customer-rc2.b64 > /tmp/customer-rc2.zip
          unzip -q /tmp/customer-rc2.zip
      - name: Apply cumulative RC3 to RC12
        shell: bash
        run: |
          base64 -d gawone-customer-rc2-to-rc3.patch.gz.b64 | gunzip > /tmp/rc3.patch
          cd gawone-customer-production && patch -p4 < /tmp/rc3.patch && cd ..
          python gawone-customer-rc3-compile-fix.py
          python gawone-customer-rc3-static-hardening.py
          base64 -d gawone-customer-rc3-to-rc4.patch.gz.b64 | gunzip > /tmp/rc4.patch
          patch -p1 < /tmp/rc4.patch
          python gawone-customer-rc5-e2e-pilot.py
          python gawone-customer-rc6-auth-fallback.py
          python gawone-customer-rc7-uiux-v2.py
          python gawone-customer-rc8-uiux-v3.py
          python gawone-customer-rc9-reliability.py
          python gawone-customer-rc10-nine-services.py
          python gawone-customer-rc11-five-service-canary.py
          python gawone-customer-rc12-mobility-foundation.py
      - name: Apply P1, P2 and P3 RC19
        shell: bash
        run: |
          python gawone-customer-rc14-business-labour.py
          python gawone-customer-rc15-p1-closure.py
          sed -i '2i // P2 endpoint label: Lokasi tujuan' gawone-customer-rc16-MobilityUi.kt
          python gawone-customer-rc16-p2.py
          python gawone-customer-rc16-lintfix.py
          python gawone-customer-rc17-p2-pilot-closure.py
          python gawone-customer-rc18-p2-live-tracking.py
          python gawone-customer-rc19-p3-payment-foundation.py
          grep -q 'versionCode = 28' gawone-customer-production/app/build.gradle.kts
          grep -q 'versionName = "1.0.18-p3-payment-foundation-rc19"' gawone-customer-production/app/build.gradle.kts
          grep -q 'get_my_order_payment_state' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/CustomerRepository.kt
          grep -q 'get_my_payment_methods' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/CustomerRepository.kt
          grep -q 'PAYMENT_PROVIDER_NOT_CONFIGURED' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/GawoneCustomerFailure.kt
          grep -q 'Sisa pembayaran' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          zip -qr GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_SOURCE.zip gawone-customer-production
      - name: P2 continuity and P3 payment safety smoke
        shell: bash
        run: |
          set -euo pipefail
          ROUTE_URL=https://fhtxlojbguineyqayhai.supabase.co/functions/v1/mobility-route
          TRACK_URL=https://fhtxlojbguineyqayhai.supabase.co/functions/v1/mobility-tracking
          PAY_URL=https://fhtxlojbguineyqayhai.supabase.co/functions/v1/payment-checkout
          curl --fail --silent --show-error --retry 2 "$ROUTE_URL" > P2_ROUTE_HEALTH.json
          curl --fail --silent --show-error --retry 2 "$TRACK_URL" > P2_TRACK_HEALTH.json
          curl --fail --silent --show-error --retry 2 "$PAY_URL" | tee P3_PAYMENT_HEALTH.json
          python - <<'PY'
          import json
          r=json.load(open('P2_ROUTE_HEALTH.json')); t=json.load(open('P2_TRACK_HEALTH.json')); p=json.load(open('P3_PAYMENT_HEALTH.json'))
          assert r.get('ok') is True and r.get('version') == 3
          assert t.get('ok') is True and t.get('version') == 3 and t.get('externalRoutingPerPoll') is False
          assert p.get('ok') is True and p.get('version') == 1
          assert p.get('featureGate') == 'PAYMENT'
          assert p.get('providerConfigured') is False
          assert p.get('mode') == 'PROVIDER_GATED_FOUNDATION'
          PY
          PAY_STATUS=$(curl --silent --show-error -o P3_PAYMENT_UNAUTH.json -w '%{http_code}' -X POST "$PAY_URL" -H 'content-type: application/json' -d '{"action":"methods"}')
          test "$PAY_STATUS" = "401"
          python - <<'PY'
          import json
          d=json.load(open('P3_PAYMENT_UNAUTH.json'))
          assert d.get('ok') is False and d.get('code') == 'AUTH_REQUIRED'
          PY
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Lint and build RC19
        working-directory: gawone-customer-production
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify RC19 APK
        shell: bash
        run: |
          APK=gawone-customer-production/app/build/outputs/apk/release/app-release.apk
          cp "$APK" GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19.apk
          unzip -t GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19.apk >/dev/null
          sha256sum GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19.apk | tee GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19.apk > GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_BADGING.txt
          grep -q "package: name='site.garsyanimultiusaha.gawone' versionCode='28' versionName='1.0.18-p3-payment-foundation-rc19'" GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19.apk > GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_SIGNATURE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19
          retention-days: 14
          if-no-files-found: error
          path: |
            GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19.apk
            GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_SHA256.txt
            GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_SOURCE.zip
            GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_BADGING.txt
            GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_SIGNATURE.txt
            P2_ROUTE_HEALTH.json
            P2_TRACK_HEALTH.json
            P3_PAYMENT_HEALTH.json
            P3_PAYMENT_UNAUTH.json
            gawone-customer-production/app/build/reports/lint-results-release.html

  emulator_smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19}
      - name: Prepare RC19 stable smoke
        shell: bash
        run: |
          mkdir -p emulator-reports
          chmod +x gawone-customer-rc19-emulator-smoke.sh
          grep -q "Pixel Launcher isn't responding" gawone-customer-rc19-emulator-smoke.sh
          grep -q 'ANR in $PKG' gawone-customer-rc19-emulator-smoke.sh
      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: RC19 Android emulator gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-window -dns-server 8.8.8.8
          script: bash gawone-customer-rc19-emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.18_P3_PAYMENT_FOUNDATION_RC19_EMULATOR_GATE
          retention-days: 90
          if-no-files-found: warn
          path: emulator-reports
