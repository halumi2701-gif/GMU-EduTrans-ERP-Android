name: Validate ERP Web v20

on:
  push:
    branches: [ "main" ]
    paths:
      - "erp-web/**"
      - "supabase/migrations/**"
      - "scripts/verify-erp-web-media.js"
      - "scripts/verify-erp-web-v10.js"
      - "scripts/build-erp-web-v10-release.js"
      - ".github/workflows/validate-erp-web-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gmu-enterprise-os-v20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate additive ERP web modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find erp-web -type f -name '*.js' -print0)
          node --check scripts/verify-erp-web-media.js
          node --check scripts/verify-erp-web-v10.js
          node --check scripts/build-erp-web-v10-release.js

      - name: Verify Media Master contract
        run: node scripts/verify-erp-web-media.js

      - name: Verify Enterprise OS v20 contract
        run: node scripts/verify-erp-web-v10.js

      - name: Verify release bundle source
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            role-privacy-v99.js \
            package-master-v97.js \
            media-master-v96.js \
            manager-ops-agent-v98.js \
            company-operating-system-v100.js \
            market-intelligence-v101.js \
            sales-target-engine-v103.js \
            company-system-center-v104.js \
            management-domains-v105.js \
            role-navigation-v106.js \
            company-detail-controls-v107.js \
            role-playbook-v108.js \
            execution-control-v109.js \
            ui-focus-shell-v110.js \
            automation-orchestrator-v111.js \
            automation-orchestrator-fix-v111.js \
            crm-finance-notification-v112.js \
            enterprise-os-v200.js \
            business-priority-v201.js \
            recovery-command-v202.js \
            unified-v10-loader.js; do
            test -f "erp-web/$file"
          done
          echo "GMU EduTrans Enterprise OS v20 + Priority Command v20.1 + Recovery Accountability v20.2 source bundle: PASS"

      - name: Build from verified pinned v9.5 rollback baseline
        run: node scripts/build-erp-web-v10-release.js

      - name: Verify preserved baseline and v20 output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/erp-web-v10/index.html
          test -f dist/erp-web-v10/baseline-v95.html
          test -f dist/erp-web-v10/release-manifest.json
          grep -Fq 'GMU EduTrans ERP v9.5' dist/erp-web-v10/baseline-v95.html
          grep -Fq 'GMU EduTrans ERP v20' dist/erp-web-v10/index.html
          grep -Fq 'Enterprise OS v20 — Company Operating System' dist/erp-web-v10/index.html
          if grep -Fq 'ERP v9.5' dist/erp-web-v10/index.html; then
            echo 'Legacy ERP v9.5 branding leaked into production output' >&2
            exit 1
          fi
          grep -Fq 'id="loginScreen"' dist/erp-web-v10/index.html
          grep -Fq 'data-page="tripfolder"' dist/erp-web-v10/index.html
          grep -Fq 'src="./unified-v10-loader.js"' dist/erp-web-v10/index.html
          grep -Fq 'gmu-enterprise-os-v20-additive' dist/erp-web-v10/index.html
          grep -Fq 'v20-enterprise-operating-system' dist/erp-web-v10/unified-v10-loader.js
          grep -Fq 'v20.1-priority-command-layer' dist/erp-web-v10/unified-v10-loader.js
          grep -Fq 'v20.2-recovery-accountability-layer' dist/erp-web-v10/unified-v10-loader.js
          grep -Fq 'business-priority-v201.js' dist/erp-web-v10/unified-v10-loader.js
          grep -Fq 'recovery-command-v202.js' dist/erp-web-v10/unified-v10-loader.js
          grep -Fq 'enterprise-os-v200.js' dist/erp-web-v10/unified-v10-loader.js
          grep -Fq 'v20-enterprise-operating-system' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'Enterprise Control Tower' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'People OS' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'Exception Center' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'Automation Map' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'internal_enterprise_control_tower' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'enterprise_exception_queue' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'staff_probation_checkpoints' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'staff_compensation_profiles' dist/erp-web-v10/enterprise-os-v200.js
          grep -Fq 'internal_gl_profit_loss' dist/erp-web-v10/crm-finance-notification-v112.js
          grep -Fq 'v11.1-transactional-automation-orchestrator' dist/erp-web-v10/automation-orchestrator-v111.js
          grep -Fq 'v11.0-focused-ui-shell' dist/erp-web-v10/ui-focus-shell-v110.js
          grep -Fq 'v20.1-business-priority-command' dist/erp-web-v10/business-priority-v201.js
          grep -Fq 'internal_gmu_priority_command' dist/erp-web-v10/business-priority-v201.js
          grep -Fq 'Sales Engine' dist/erp-web-v10/business-priority-v201.js
          grep -Fq 'Profitability' dist/erp-web-v10/business-priority-v201.js
          grep -Fq 'Finance Closing' dist/erp-web-v10/business-priority-v201.js
          grep -Fq 'Master Paket' dist/erp-web-v10/business-priority-v201.js
          grep -Fq 'Manager AI' dist/erp-web-v10/business-priority-v201.js
          grep -Fq 'Executive Control Tower' dist/erp-web-v10/business-priority-v201.js
          grep -Fq 'v20.2-recovery-accountability-command' dist/erp-web-v10/recovery-command-v202.js
          grep -Fq 'Recovery Command & Accountability' dist/erp-web-v10/recovery-command-v202.js
          grep -Fq 'RECOVERY_ACTION' dist/erp-web-v10/recovery-command-v202.js
          grep -Fq 'TIDAK ADA TINDAKAN DIREKTUR' dist/erp-web-v10/recovery-command-v202.js
          for module in sales-target-engine-v103.js company-system-center-v104.js management-domains-v105.js role-navigation-v106.js company-detail-controls-v107.js role-playbook-v108.js execution-control-v109.js ui-focus-shell-v110.js automation-orchestrator-v111.js automation-orchestrator-fix-v111.js crm-finance-notification-v112.js enterprise-os-v200.js business-priority-v201.js recovery-command-v202.js; do
            test -f "dist/erp-web-v10/$module"
          done
          grep -Fq 'v20-enterprise-operating-system' dist/erp-web-v10/vercel.json
          grep -Fq 'v20.1-priority-command-layer' dist/erp-web-v10/vercel.json
          grep -Fq 'v20.2-recovery-accountability-layer' dist/erp-web-v10/vercel.json
          echo "Pinned rollback baseline + GMU EduTrans Enterprise OS v20 + Priority Command v20.1 + Recovery Accountability v20.2 release: PASS"

      - name: Upload Enterprise OS release candidate
        uses: actions/upload-artifact@v4
        with:
          name: gmu-edutrans-enterprise-os-v20-release-candidate
          path: dist/erp-web-v10/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified release snapshot branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          cp -a dist/erp-web-v10/. "$snapshot/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan erp-web-v10-release
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$snapshot"/. .
          git add -A
          git commit -m "release: GMU EduTrans Enterprise OS v20 + Priority Command v20.1 + Recovery Accountability v20.2 from ${GITHUB_SHA}"
          git push --force origin HEAD:erp-web-v10-release

      - name: Release summary
        shell: bash
        run: |
          echo "GMU EduTrans Enterprise Operating System v20 + Priority Command v20.1 + Recovery Accountability v20.2 validated."
          echo "Priority: Sales Engine → Profitability → Finance Closing → Master Paket → Manager AI → Executive Control Tower."
          echo "Recovery: Masalah → Penyebab/Data → PIC → Tindakan → Deadline → Target Hasil → Bukti → Evaluasi."
          echo "Control: Enterprise Control Tower, Exception Center, Automation Map and Pusat Pemulihan."
          echo "People: recruitment, contract, onboarding, probation 30/60/90, attendance, leave, KPI, review, payroll, training, warning, asset/access and offboarding."
          echo "Rollback baseline: verified immutable ERP v9.5 snapshot"
          echo "Visible UI branding: Enterprise OS v20"
          echo "Release branch: erp-web-v10-release"