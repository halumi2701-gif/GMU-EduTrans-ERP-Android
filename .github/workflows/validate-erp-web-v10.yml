name: Validate ERP Web v10

on:
  push:
    branches: [ "main" ]
    paths:
      - "erp-web/**"
      - "scripts/verify-erp-web-media.js"
      - "scripts/verify-erp-web-v10.js"
      - "scripts/build-erp-web-v10-release.js"
      - ".github/workflows/validate-erp-web-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gmu-erp-web-v10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate additive ERP web modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find erp-web -type f -name '*.js' -print0)
          node --check scripts/verify-erp-web-media.js
          node --check scripts/verify-erp-web-v10.js
          node --check scripts/build-erp-web-v10-release.js

      - name: Verify Media Master contract
        run: node scripts/verify-erp-web-media.js

      - name: Verify ERP Execution & Control contract
        run: node scripts/verify-erp-web-v10.js

      - name: Verify release bundle source
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            role-privacy-v99.js \
            package-master-v97.js \
            media-master-v96.js \
            manager-ops-agent-v98.js \
            company-operating-system-v100.js \
            market-intelligence-v101.js \
            sales-target-engine-v103.js \
            company-system-center-v104.js \
            management-domains-v105.js \
            role-navigation-v106.js \
            company-detail-controls-v107.js \
            role-playbook-v108.js \
            execution-control-v109.js \
            unified-v10-loader.js; do
            test -f "erp-web/$file"
          done
          echo "ERP Web v10.9 Execution & Control source bundle: PASS"

      - name: Build from verified pinned v9.5 rollback baseline
        run: node scripts/build-erp-web-v10-release.js

      - name: Verify preserved baseline and execution-control output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/erp-web-v10/index.html
          test -f dist/erp-web-v10/baseline-v95.html
          test -f dist/erp-web-v10/release-manifest.json
          grep -Fq 'GMU EduTrans ERP v9.5' dist/erp-web-v10/baseline-v95.html
          grep -Fq 'GMU EduTrans ERP v10.9' dist/erp-web-v10/index.html
          grep -Fq 'ERP v10.9 — Company Operating System' dist/erp-web-v10/index.html
          grep -Fq 'Jobdesk & SOP' dist/erp-web-v10/index.html
          grep -Fq 'Tugas Otomatis' dist/erp-web-v10/index.html
          grep -Fq 'Penggajian & Fee' dist/erp-web-v10/index.html
          grep -Fq 'Rekrutmen & Onboarding' dist/erp-web-v10/index.html
          grep -Fq 'Keluhan & CAPA' dist/erp-web-v10/index.html
          grep -Fq 'Perkiraan Kas' dist/erp-web-v10/index.html
          grep -Fq 'Perencanaan SDM' dist/erp-web-v10/index.html
          grep -Fq 'Daftar Risiko' dist/erp-web-v10/index.html
          grep -Fq 'Intelijen Pasar Cianjur–Sukabumi' dist/erp-web-v10/index.html
          if grep -Fq 'ERP v9.5' dist/erp-web-v10/index.html; then
            echo 'Legacy ERP v9.5 branding leaked into production output' >&2
            exit 1
          fi
          grep -Fq 'id="loginScreen"' dist/erp-web-v10/index.html
          grep -Fq 'data-page="tripfolder"' dist/erp-web-v10/index.html
          grep -Fq 'src="./unified-v10-loader.js"' dist/erp-web-v10/index.html
          grep -Fq 'gmu-erp-v10-additive' dist/erp-web-v10/index.html
          grep -Fq 'v10.9-execution-control-system' dist/erp-web-v10/unified-v10-loader.js
          grep -Fq 'v10.9-execution-control-layer' dist/erp-web-v10/execution-control-v109.js
          grep -Fq 'v10.9-role-navigation-guard' dist/erp-web-v10/role-navigation-v106.js
          grep -Fq 'v10.8-role-playbook' dist/erp-web-v10/role-playbook-v108.js
          for module in sales-target-engine-v103.js company-system-center-v104.js management-domains-v105.js role-navigation-v106.js company-detail-controls-v107.js role-playbook-v108.js execution-control-v109.js; do
            test -f "dist/erp-web-v10/$module"
          done
          echo "Pinned rollback baseline + ERP v10.9 Execution & Control release: PASS"

      - name: Upload ERP Web release candidate
        uses: actions/upload-artifact@v4
        with:
          name: gmu-edutrans-erp-web-v10-release-candidate
          path: dist/erp-web-v10/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified release snapshot branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          cp -a dist/erp-web-v10/. "$snapshot/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan erp-web-v10-release
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$snapshot"/. .
          git add -A
          git commit -m "release: ERP Web v10.9 Execution & Control System from ${GITHUB_SHA}"
          git push --force origin HEAD:erp-web-v10-release

      - name: Release summary
        shell: bash
        run: |
          echo "GMU EduTrans ERP v10.9 Execution & Control System validated."
          echo "Role playbooks + daily execution + H-7/H-3/H-1/H+1/H+3 automation views + payroll lifecycle + recruitment + CAPA + cash forecast + workforce planning + risk register."
          echo "Rollback baseline: verified immutable ERP v9.5 snapshot"
          echo "Visible UI branding: ERP v10.9"
          echo "Release branch: erp-web-v10-release"
