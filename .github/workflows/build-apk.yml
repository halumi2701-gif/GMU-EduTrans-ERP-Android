name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Use exact GMU EduTrans logo
        run: |
          rm -f app/src/main/res/drawable/ic_launcher_gmu.xml
          curl -fsSL "https://gtgnwasijweewmaubvyg.supabase.co/functions/v1/gmu-logo" \
            -o app/src/main/res/drawable/ic_launcher_gmu.jpg
          file app/src/main/res/drawable/ic_launcher_gmu.jpg

      - name: Reject WebView usage
        run: |
          if grep -R "android.webkit.WebView\|<WebView" -n app/src/main; then
            echo "WebView is forbidden in GMU EduTrans Native ERP"
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMU-EduTrans-ERP-AllInOne-v1.0.0-RC2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
