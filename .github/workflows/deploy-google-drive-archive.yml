name: Deploy Google Drive Archive Integration

on:
  push:
    branches: [ "main" ]
    paths:
      - "supabase/functions/gmu-drive-archive/**"
      - ".github/workflows/deploy-google-drive-archive.yml"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Ketik DEPLOY untuk menerapkan integrasi Google Drive ke production"
        required: true
        default: "NO"
        type: choice
        options: ["NO", "DEPLOY"]

permissions:
  contents: read

concurrency:
  group: gmu-edutrans-supabase-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: gtgnwasijweewmaubvyg
  SUPABASE_DB_POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com
  GMU_DRIVE_ROOT_FOLDER_ID: 16Czc7Bd3sI7Bc7OV7RMmknjyNAVDfwpm
  GMU_DRIVE_ORDER_FOLDER_ID: 1eLza3RKK7sMPuHF55k1V8G09_KN9rPJR

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm_production == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260930084000_gmu_v231_google_drive_archive.sql
          test -f supabase/functions/gmu-drive-archive/index.ts
          grep -Fq '[functions.gmu-drive-archive]' supabase/config.toml

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN belum tersedia."; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "SUPABASE_DB_PASSWORD belum tersedia."; exit 1; }
          test -n "${GOOGLE_DRIVE_CLIENT_ID:-}" || { echo "GOOGLE_DRIVE_CLIENT_ID belum tersedia."; exit 1; }
          test -n "${GOOGLE_DRIVE_CLIENT_SECRET:-}" || { echo "GOOGLE_DRIVE_CLIENT_SECRET belum tersedia."; exit 1; }
          test -n "${GOOGLE_DRIVE_REFRESH_TOKEN:-}" || { echo "GOOGLE_DRIVE_REFRESH_TOKEN belum tersedia."; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: v2.118.0

      - name: Link production
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply targeted Google Drive migration over Supavisor IPv4
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          DB_CONN="host=$SUPABASE_DB_POOLER_HOST port=5432 dbname=postgres user=postgres.$SUPABASE_PROJECT_ID sslmode=require"

          HAS_PROFILE_FLAG="$(psql "$DB_CONN" -Atc "select exists (select 1 from information_schema.columns where table_schema='public' and table_name='profiles' and column_name='is_active');")"
          test "$HAS_PROFILE_FLAG" = "t" || { echo "profiles.is_active tidak ditemukan; migration dihentikan agar tidak merusak production."; exit 1; }

          psql "$DB_CONN"             --set ON_ERROR_STOP=1             --single-transaction             --file supabase/migrations/20260930084000_gmu_v231_google_drive_archive.sql

          VERIFY="$(psql "$DB_CONN" -Atc "select (to_regclass('public.gmu_drive_folders') is not null) and (to_regclass('public.gmu_drive_documents') is not null) and coalesce((select relrowsecurity from pg_class where oid='public.gmu_drive_folders'::regclass), false) and coalesce((select relrowsecurity from pg_class where oid='public.gmu_drive_documents'::regclass), false);")"
          test "$VERIFY" = "t" || { echo "Verifikasi tabel/RLS Google Drive gagal."; exit 1; }

          unset PGPASSWORD DB_CONN

      - name: Configure Edge Function secrets
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_CLIENT_ID="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_CLIENT_ID"].strip(), end="")')"
          CLEAN_CLIENT_SECRET="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_CLIENT_SECRET"].strip(), end="")')"
          CLEAN_REFRESH_TOKEN="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_REFRESH_TOKEN"].strip(), end="")')"
          SMOKE_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48), end="")')"
          test -n "$CLEAN_CLIENT_ID" && test -n "$CLEAN_CLIENT_SECRET" && test -n "$CLEAN_REFRESH_TOKEN"
          test "${#SMOKE_TOKEN}" -ge 32
          echo "::add-mask::$SMOKE_TOKEN"
          echo "GMU_DRIVE_SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"

          supabase secrets set \
            GOOGLE_DRIVE_CLIENT_ID="$CLEAN_CLIENT_ID" \
            GOOGLE_DRIVE_CLIENT_SECRET="$CLEAN_CLIENT_SECRET" \
            GOOGLE_DRIVE_REFRESH_TOKEN="$CLEAN_REFRESH_TOKEN" \
            GMU_DRIVE_ROOT_FOLDER_ID="$GMU_DRIVE_ROOT_FOLDER_ID" \
            GMU_DRIVE_ORDER_FOLDER_ID="$GMU_DRIVE_ORDER_FOLDER_ID" \
            GMU_DRIVE_SMOKE_TOKEN="$SMOKE_TOKEN" \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify Google Drive OAuth and archive folders
        shell: bash
        run: |
          set -euo pipefail

          CLEAN_CLIENT_ID="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_CLIENT_ID"].strip(), end="")')"
          CLEAN_CLIENT_SECRET="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_CLIENT_SECRET"].strip(), end="")')"
          CLEAN_REFRESH_TOKEN="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_REFRESH_TOKEN"].strip(), end="")')"

          TOKEN_HTTP="$(curl -sS -o /tmp/google-token.json -w '%{http_code}' https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLEAN_CLIENT_ID" \
            --data-urlencode "client_secret=$CLEAN_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CLEAN_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          if [ "$TOKEN_HTTP" != "200" ]; then
            GOOGLE_ERROR="$(python3 -c 'import json; d=json.load(open("/tmp/google-token.json")); print(d.get("error","unknown"))' 2>/dev/null || echo unknown)"
            echo "Google OAuth token exchange gagal HTTP $TOKEN_HTTP ($GOOGLE_ERROR)."
            exit 1
          fi
          TOKEN_JSON="$(cat /tmp/google-token.json)"

          ACCESS_TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')"
          test -n "$ACCESS_TOKEN" || { echo "Google OAuth tidak menghasilkan access token."; exit 1; }
          echo "::add-mask::$ACCESS_TOKEN"

          ROOT_JSON="$(curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$GMU_DRIVE_ROOT_FOLDER_ID?fields=id,name,mimeType,trashed")"
          ROOT_ID="$(printf '%s' "$ROOT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
          ROOT_TRASHED="$(printf '%s' "$ROOT_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("trashed",False)).lower())')"
          test "$ROOT_ID" = "$GMU_DRIVE_ROOT_FOLDER_ID" || { echo "Root arsip Drive tidak cocok."; exit 1; }
          test "$ROOT_TRASHED" = "false" || { echo "Root arsip Drive berada di trash."; exit 1; }

          ORDER_JSON="$(curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$GMU_DRIVE_ORDER_FOLDER_ID?fields=id,name,mimeType,trashed,parents")"
          ORDER_ID="$(printf '%s' "$ORDER_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
          ORDER_TRASHED="$(printf '%s' "$ORDER_JSON" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("trashed",False)).lower())')"
          test "$ORDER_ID" = "$GMU_DRIVE_ORDER_FOLDER_ID" || { echo "Folder ORDER & BOOKING tidak cocok."; exit 1; }
          test "$ORDER_TRASHED" = "false" || { echo "Folder ORDER & BOOKING berada di trash."; exit 1; }

          echo "Google OAuth valid dan root arsip + ORDER & BOOKING dapat dibaca."

      - name: Deploy Drive archive Edge Function
        run: supabase functions deploy gmu-drive-archive --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify Drive archive function is deployed
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list | grep -Fq "gmu-drive-archive"
          STATUS="$(curl -sS -o /tmp/drive-health-response.txt -w '%{http_code}' \
            -X POST "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/gmu-drive-archive" \
            -H 'Content-Type: application/json' \
            --data '{"action":"health"}')"
          test "$STATUS" = "401" || { echo "Unexpected unauthenticated health status: $STATUS"; cat /tmp/drive-health-response.txt; exit 1; }
          echo "Drive archive function is live and enforcing authentication (HTTP 401 without user token)."

      - name: Production booking-to-Drive smoke test
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/gmu-drive-archive"
          BOOKING_CODE="_SMOKE-ERP-DRIVE"
          CUSTOMER_NAME="UJI OTOMATIS JANGAN DIPROSES"
          ACTIVITY_DATE="2026-09-30"
          PAYLOAD="$(python3 - <<'PY'
import json
print(json.dumps({
  "action": "smoke_test",
  "entity_id": "_SMOKE-ERP-DRIVE",
  "booking_code": "_SMOKE-ERP-DRIVE",
  "customer_name": "UJI OTOMATIS JANGAN DIPROSES",
  "activity_date": "2026-09-30",
}))
PY
)"

          curl -fsS "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "x-gmu-drive-smoke: $GMU_DRIVE_SMOKE_TOKEN" \
            --data "$PAYLOAD" > /tmp/drive-smoke-1.json

          curl -fsS "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "x-gmu-drive-smoke: $GMU_DRIVE_SMOKE_TOKEN" \
            --data "$PAYLOAD" > /tmp/drive-smoke-2.json

          python3 - <<'PY'
import json
a=json.load(open('/tmp/drive-smoke-1.json'))
b=json.load(open('/tmp/drive-smoke-2.json'))
assert a.get('ok') is True, a
assert b.get('ok') is True, b
fa=a.get('folder') or {}
fb=b.get('folder') or {}
assert fa.get('drive_folder_id'), fa
assert fa.get('drive_folder_id') == fb.get('drive_folder_id'), (fa,fb)
children=(fb.get('metadata') or {}).get('children') or {}
expected=[
  "01 - PENAWARAN","02 - BOOKING","03 - PEMBAYARAN","04 - DATA PESERTA",
  "05 - OPERASIONAL","06 - TIKET","07 - DOKUMENTASI","08 - LAPORAN","09 - DOKUMEN FINAL"
]
assert sorted(children.keys()) == sorted(expected), children
assert len(set(children.values())) == 9, children
assert b.get('reused') is True, b
print("Edge Function idempotency PASS:", fa.get('drive_folder_id'))
PY

          CLEAN_CLIENT_ID="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_CLIENT_ID"].strip(), end="")')"
          CLEAN_CLIENT_SECRET="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_CLIENT_SECRET"].strip(), end="")')"
          CLEAN_REFRESH_TOKEN="$(python3 -c 'import os; print(os.environ["GOOGLE_DRIVE_REFRESH_TOKEN"].strip(), end="")')"
          TOKEN_JSON="$(curl -fsS https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLEAN_CLIENT_ID" \
            --data-urlencode "client_secret=$CLEAN_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CLEAN_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          ACCESS_TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "::add-mask::$ACCESS_TOKEN"

          ORDER_FOLDER_ID="$(python3 -c 'import json; print(json.load(open("/tmp/drive-smoke-2.json"))["folder"]["drive_folder_id"])')"
          FOLDER_NAME="$(python3 -c 'import json; print(json.load(open("/tmp/drive-smoke-2.json"))["folder"]["folder_name"])')"

          curl -fsS -G "https://www.googleapis.com/drive/v3/files" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q=name='$FOLDER_NAME' and '$GMU_DRIVE_ORDER_FOLDER_ID' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false" \
            --data-urlencode "fields=files(id,name)" \
            --data-urlencode "pageSize=20" > /tmp/drive-parent-count.json

          curl -fsS -G "https://www.googleapis.com/drive/v3/files" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q='$ORDER_FOLDER_ID' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false" \
            --data-urlencode "fields=files(id,name)" \
            --data-urlencode "pageSize=50" > /tmp/drive-children.json

          python3 - <<'PY'
import json
parent=json.load(open('/tmp/drive-parent-count.json')).get('files',[])
children=json.load(open('/tmp/drive-children.json')).get('files',[])
expected=[
  "01 - PENAWARAN","02 - BOOKING","03 - PEMBAYARAN","04 - DATA PESERTA",
  "05 - OPERASIONAL","06 - TIKET","07 - DOKUMENTASI","08 - LAPORAN","09 - DOKUMEN FINAL"
]
assert len(parent) == 1, parent
names=[x.get('name') for x in children]
for name in expected:
    assert names.count(name) == 1, (name,names)
assert len([n for n in names if n in expected]) == 9, names
print("Google Drive structure PASS: one order folder + exactly one of each 9 standard subfolders.")
PY

      - name: Summary
        run: |
          echo "Google Drive Archive integration deployed."
          echo "Root folder: $GMU_DRIVE_ROOT_FOLDER_ID"
          echo "Order parent: $GMU_DRIVE_ORDER_FOLDER_ID"
          echo "Smoke test: PASS requires same folder reused and 9 standard subfolders without duplicates."
