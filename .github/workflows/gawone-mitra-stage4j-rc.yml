name: GAWONE Mitra Stage 4J Auth Fallback Pilot

on:
  push:
    branches:
      - gawone-mitra-apk-build
    paths:
      - "gawone-mitra-stage4j/**"
      - ".github/workflows/gawone-mitra-stage4j-rc.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cumulative E2E source contract
        shell: bash
        run: |
          ROOT="gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra"
          grep -q 'Stage4DOfferPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4EExecutionPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4GCommunicationPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4FWalletPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'request_partner_payout' "$ROOT/Stage4FWallet.kt"
          grep -q 'accept_assignment_offer' "$ROOT/Stage4DOffer.kt"
          grep -q 'reject_assignment_offer' "$ROOT/Stage4DOffer.kt"
          grep -q 'partner_assignment_action' "$ROOT/Stage4EExecution.kt"
          grep -q 'send_order_chat_message' "$ROOT/Stage4GCommunication.kt"
          grep -q 'class PilotAuthActivity' "$ROOT/PilotAuthActivity.kt"
          grep -q '/auth/v1/signup' "$ROOT/PilotAuthActivity.kt"
          grep -q 'grant_type=password' "$ROOT/PilotAuthActivity.kt"
          grep -q 'android:name=".PilotAuthActivity"' gawone-mitra-stage4j/app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 14' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'versionName = "1.0.4-auth-fallback"' gawone-mitra-stage4j/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compile debug and release
        run: |
          gradle -p gawone-mitra-stage4j --no-daemon --stacktrace :app:compileDebugKotlin :app:compileReleaseKotlin
          gradle -p gawone-mitra-stage4j --no-daemon :app:processDebugResources :app:processReleaseResources

      - name: Release lint
        run: gradle -p gawone-mitra-stage4j --no-daemon :app:lintRelease

      - name: Build installable auth fallback test APK
        run: gradle -p gawone-mitra-stage4j --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK metadata
        shell: bash
        run: |
          APK="gawone-mitra-stage4j/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='site.garsyanimultiusaha.gawone.mitra.debug'" apk-badging.txt
          grep "versionCode='14'" apk-badging.txt
          grep "versionName='1.0.4-auth-fallback-test'" apk-badging.txt
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Prepare artifact
        run: |
          mkdir -p artifact-stage4j
          cp gawone-mitra-stage4j/app/build/outputs/apk/debug/app-debug.apk artifact-stage4j/GAWONE-Mitra-v1.0.4-Auth-Fallback-test.apk
          cp apk-sha256.txt artifact-stage4j/SHA256.txt
          cp apk-badging.txt artifact-stage4j/APK_BADGING.txt
          cat > artifact-stage4j/README.txt <<'EOF'
          GAWONE Mitra v1.0.4 Auth Fallback test APK
          Package: site.garsyanimultiusaha.gawone.mitra.debug
          Login: Email + Password fallback plus existing Phone OTP flow.
          Baseline: full cumulative Stage 4J (Presence + Offer + Job + Wallet/Payout + Chat + Account + Runtime hardening)
          Pilot service: CLEANING first.
          Signing: Android debug signing (test only)
          EOF

      - name: Upload Stage 4J Auth Fallback APK
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE-Mitra-v1.0.4-Auth-Fallback-test-APK
          path: artifact-stage4j/
          if-no-files-found: error
          retention-days: 14
