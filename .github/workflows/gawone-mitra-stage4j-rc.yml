name: GAWONE Mitra Stage 4J Email Primary Pilot

on:
  push:
    branches:
      - gawone-mitra-apk-build
    paths:
      - "gawone-mitra-stage4j/**"
      - ".github/workflows/gawone-mitra-stage4j-rc.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cumulative E2E source contract
        shell: bash
        run: |
          ROOT="gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra"
          grep -q 'Stage4DOfferPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4EExecutionPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4GCommunicationPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4FWalletPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'request_partner_payout' "$ROOT/Stage4FWallet.kt"
          grep -q 'accept_assignment_offer' "$ROOT/Stage4DOffer.kt"
          grep -q 'partner_assignment_action' "$ROOT/Stage4EExecution.kt"
          grep -q 'send_order_chat_message' "$ROOT/Stage4GCommunication.kt"
          grep -q 'class MitraLoginActivity' "$ROOT/MitraLoginActivity.kt"
          grep -q 'grant_type=password' "$ROOT/MitraLoginActivity.kt"
          grep -q 'register_as_partner' "$ROOT/MitraLoginActivity.kt"
          grep -q 'android:name=".MitraLoginActivity"' gawone-mitra-stage4j/app/src/main/AndroidManifest.xml

      - name: Apply email-primary navigation and partner bootstrap fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/MainActivity.kt")
          s = p.read_text()
          old = "        val d = api.dashboard()\n        if (d == null) {\n            api.registerPartner()\n            screen = Screen.PROFILE\n            return\n        }\n        dashboard = d\n"
          new = "        api.registerPartner()\n        val d = api.dashboard()\n        if (d == null) {\n            screen = Screen.PROFILE\n            return\n        }\n        dashboard = d\n"
          if old in s:
              s = s.replace(old, new, 1)
          old = "        if (api.readSession() == null) {\n            screen = Screen.PHONE\n            return\n        }\n"
          new = "        if (api.readSession() == null) {\n            throw ApiException(\"AUTH_REQUIRED\")\n        }\n"
          if old not in s:
              raise SystemExit("missing no-session bootstrap block")
          s = s.replace(old, new, 1)
          old = "    LaunchedEffect(Unit) {\n        runCatching { bootstrap() }.onFailure {\n            api.clearSession()\n            screen = Screen.PHONE\n            error = \"Sesi lama tidak dapat dipakai. Silakan login kembali.\"\n        }\n    }\n"
          new = "    LaunchedEffect(Unit) {\n        runCatching { bootstrap() }.onFailure {\n            api.clearSession()\n            context.startActivity(Intent(context, MitraLoginActivity::class.java))\n            (context as? ComponentActivity)?.finish()\n        }\n    }\n"
          if old not in s:
              raise SystemExit("missing bootstrap failure block")
          s = s.replace(old, new, 1)
          old = "                onLogout = {\n                    launchTask {\n                        api.signOut()\n                        phone = \"\"\n                        otp = \"\"\n                        screen = Screen.PHONE\n                    }\n                }\n"
          new = "                onLogout = {\n                    launchTask {\n                        api.signOut()\n                        context.startActivity(Intent(context, MitraLoginActivity::class.java))\n                        (context as? ComponentActivity)?.finish()\n                    }\n                }\n"
          if old not in s:
              raise SystemExit("missing logout block")
          s = s.replace(old, new, 1)
          p.write_text(s)
          gpath = Path("gawone-mitra-stage4j/app/build.gradle.kts")
          g = gpath.read_text()
          g = g.replace("versionCode = 14", "versionCode = 16", 1)
          g = g.replace('versionName = "1.0.4-auth-fallback"', 'versionName = "1.0.6-email-primary"', 1)
          gpath.write_text(g)
          PY
          grep -q 'throw ApiException("AUTH_REQUIRED")' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/MainActivity.kt
          grep -q 'MitraLoginActivity::class.java' gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/MainActivity.kt
          grep -q 'versionCode = 16' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'versionName = "1.0.6-email-primary"' gawone-mitra-stage4j/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compile debug and release
        shell: bash
        run: |
          gradle -p gawone-mitra-stage4j --no-daemon --stacktrace :app:compileDebugKotlin :app:compileReleaseKotlin
          gradle -p gawone-mitra-stage4j --no-daemon :app:processDebugResources :app:processReleaseResources

      - name: Release lint
        run: gradle -p gawone-mitra-stage4j --no-daemon :app:lintRelease

      - name: Build installable email-primary test APK
        run: gradle -p gawone-mitra-stage4j --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK metadata
        shell: bash
        run: |
          APK="gawone-mitra-stage4j/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='site.garsyanimultiusaha.gawone.mitra.debug'" apk-badging.txt
          grep "versionCode='16'" apk-badging.txt
          grep "versionName='1.0.6-email-primary-test'" apk-badging.txt
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact-stage4j
          cp gawone-mitra-stage4j/app/build/outputs/apk/debug/app-debug.apk artifact-stage4j/GAWONE-Mitra-v1.0.6-Email-Primary-test.apk
          cp apk-sha256.txt artifact-stage4j/SHA256.txt
          cp apk-badging.txt artifact-stage4j/APK_BADGING.txt

      - name: Upload Stage 4J Email Primary APK
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE-Mitra-v1.0.6-Email-Primary-test-APK
          path: artifact-stage4j/
          if-no-files-found: error
          retention-days: 14
