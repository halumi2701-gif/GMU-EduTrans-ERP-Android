name: GAWONE Mitra Stage 4J Partner Bootstrap Pilot

on:
  push:
    branches:
      - gawone-mitra-apk-build
    paths:
      - "gawone-mitra-stage4j/**"
      - ".github/workflows/gawone-mitra-stage4j-rc.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cumulative E2E source contract
        shell: bash
        run: |
          ROOT="gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra"
          grep -q 'Stage4DOfferPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4EExecutionPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4GCommunicationPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'Stage4FWalletPanel' "$ROOT/Stage4JHomeShell.kt"
          grep -q 'request_partner_payout' "$ROOT/Stage4FWallet.kt"
          grep -q 'accept_assignment_offer' "$ROOT/Stage4DOffer.kt"
          grep -q 'partner_assignment_action' "$ROOT/Stage4EExecution.kt"
          grep -q 'send_order_chat_message' "$ROOT/Stage4GCommunication.kt"
          grep -q 'class PilotAuthActivity' "$ROOT/PilotAuthActivity.kt"
          grep -q 'grant_type=password' "$ROOT/PilotAuthActivity.kt"

      - name: Apply partner bootstrap ordering fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("gawone-mitra-stage4j/app/src/main/java/site/garsyanimultiusaha/gawone/mitra/MainActivity.kt")
          s = p.read_text()
          old = "        val d = api.dashboard()\n        if (d == null) {\n            api.registerPartner()\n            screen = Screen.PROFILE\n            return\n        }\n        dashboard = d\n"
          new = "        api.registerPartner()\n        val d = api.dashboard()\n        if (d == null) {\n            screen = Screen.PROFILE\n            return\n        }\n        dashboard = d\n"
          if old not in s:
              raise SystemExit("bootstrap target block not found")
          p.write_text(s.replace(old, new, 1))

          gpath = Path("gawone-mitra-stage4j/app/build.gradle.kts")
          g = gpath.read_text()
          g = g.replace("versionCode = 14", "versionCode = 15", 1)
          g = g.replace('versionName = "1.0.4-auth-fallback"', 'versionName = "1.0.5-partner-bootstrap"', 1)
          gpath.write_text(g)
          PY
          grep -q 'versionCode = 15' gawone-mitra-stage4j/app/build.gradle.kts
          grep -q 'versionName = "1.0.5-partner-bootstrap"' gawone-mitra-stage4j/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compile debug and release
        shell: bash
        run: |
          gradle -p gawone-mitra-stage4j --no-daemon --stacktrace :app:compileDebugKotlin :app:compileReleaseKotlin
          gradle -p gawone-mitra-stage4j --no-daemon :app:processDebugResources :app:processReleaseResources

      - name: Release lint
        run: gradle -p gawone-mitra-stage4j --no-daemon :app:lintRelease

      - name: Build installable partner bootstrap test APK
        run: gradle -p gawone-mitra-stage4j --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK metadata
        shell: bash
        run: |
          APK="gawone-mitra-stage4j/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='site.garsyanimultiusaha.gawone.mitra.debug'" apk-badging.txt
          grep "versionCode='15'" apk-badging.txt
          grep "versionName='1.0.5-partner-bootstrap-test'" apk-badging.txt
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact-stage4j
          cp gawone-mitra-stage4j/app/build/outputs/apk/debug/app-debug.apk artifact-stage4j/GAWONE-Mitra-v1.0.5-Partner-Bootstrap-test.apk
          cp apk-sha256.txt artifact-stage4j/SHA256.txt
          cp apk-badging.txt artifact-stage4j/APK_BADGING.txt

      - name: Upload Stage 4J Partner Bootstrap APK
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE-Mitra-v1.0.5-Partner-Bootstrap-test-APK
          path: artifact-stage4j/
          if-no-files-found: error
          retention-days: 14
