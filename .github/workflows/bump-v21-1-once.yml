name: One-time ERP v21.1 Version Alignment

on:
  push:
    paths:
      - '.github/workflows/bump-v21-1-once.yml'

permissions:
  contents: write

jobs:
  align-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align Android and artifact version to v21.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          debug = Path('.github/workflows/build-apk.yml')
          release = Path('.github/workflows/build-release.yml')

          build_text = build.read_text()
          debug_text = debug.read_text()
          release_text = release.read_text()

          guards = {
              'versionCode = 20002': build_text.count('versionCode = 20002'),
              'versionName = "20.2"': build_text.count('versionName = "20.2"'),
              'GMU-EduTrans-ERP-v20.2-debug': debug_text.count('GMU-EduTrans-ERP-v20.2-debug'),
              'GMU-EduTrans-ERP-v20.2-unsigned': release_text.count('GMU-EduTrans-ERP-v20.2-unsigned'),
          }
          bad = {k: v for k, v in guards.items() if v != 1}
          if bad:
              raise SystemExit(f'Guard failed: {bad}')

          build_text = build_text.replace('versionCode = 20002', 'versionCode = 21001', 1)
          build_text = build_text.replace('versionName = "20.2"', 'versionName = "21.1"', 1)
          debug_text = debug_text.replace('GMU-EduTrans-ERP-v20.2-debug', 'GMU-EduTrans-ERP-v21.1-debug', 1)
          release_text = release_text.replace('GMU-EduTrans-ERP-v20.2-unsigned', 'GMU-EduTrans-ERP-v21.1-unsigned', 1)

          build.write_text(build_text)
          debug.write_text(debug_text)
          release.write_text(release_text)
          Path('.github/workflows/bump-v21-1-once.yml').unlink()
          PY

      - name: Verify aligned version
        shell: bash
        run: |
          grep -q 'versionCode = 21001' app/build.gradle.kts
          grep -q 'versionName = "21.1"' app/build.gradle.kts
          grep -q 'GMU-EduTrans-ERP-v21.1-debug' .github/workflows/build-apk.yml
          grep -q 'GMU-EduTrans-ERP-v21.1-unsigned' .github/workflows/build-release.yml
          ! grep -q 'GMU-EduTrans-ERP-v20.2' .github/workflows/build-apk.yml
          ! grep -q 'GMU-EduTrans-ERP-v20.2' .github/workflows/build-release.yml

      - name: Commit version alignment
        shell: bash
        run: |
          git config user.name 'GMU EduTrans Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore(android): align ERP Android version to v21.1'
          git push origin HEAD:main
