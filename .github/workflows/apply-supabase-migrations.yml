name: Apply GMU Supabase Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmu-edutrans-supabase-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: gtgnwasijweewmaubvyg

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v22.6 unified Sales pricing migration
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260917193000_gmu_v226_sales_public_b2b_unified_pricing.sql
          grep -Fq 'STATION-PROF-2026' supabase/migrations/20260917193000_gmu_v226_sales_public_b2b_unified_pricing.sql
          grep -Fq 'resolve_sales_price_v226' supabase/migrations/20260917193000_gmu_v226_sales_public_b2b_unified_pricing.sql
          grep -Fq 'create_sales_booking_v226' supabase/migrations/20260917193000_gmu_v226_sales_public_b2b_unified_pricing.sql

      - name: Validate Supabase credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN belum tersedia."; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: v2.117.0

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref "$SUPABASE_PROJECT_ID"
          fi
          supabase migration list

      - name: Dry-run pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

      - name: Summary
        run: |
          echo "Supabase production migrations applied."
          echo "Project: $SUPABASE_PROJECT_ID"
          echo "Sales pricing: PUBLIC + B2B unified v22.6"
