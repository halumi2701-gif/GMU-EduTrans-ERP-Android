name: Check Vercel Deploy Credential

on:
  push:
    branches: [ "main" ]
    paths:
      - "deploy/CHECK_VERCEL"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel token presence
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN=SET"
          else
            echo "VERCEL_TOKEN=EMPTY"
            exit 1
          fi
