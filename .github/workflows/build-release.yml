name: Build GMU EduTrans ERP Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Use exact GMU EduTrans logo
        run: |
          rm -f app/src/main/res/drawable/ic_launcher_gmu.xml
          curl -fsSL "https://gtgnwasijweewmaubvyg.supabase.co/functions/v1/gmu-logo"             -o app/src/main/res/drawable/ic_launcher_gmu.jpg
          file app/src/main/res/drawable/ic_launcher_gmu.jpg

      - name: Build unsigned release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify unsigned release APK
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Package Android signing tools
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" signing-tools/
          cp "$BT/zipalign" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          echo "$BT" > signing-tools/build-tools-version.txt

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: GMU-EduTrans-ERP-v1.0.0-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools/
          if-no-files-found: error
          retention-days: 14
