name: GMU EduTrans Sales Production Gate

on:
  workflow_dispatch:
  push:
    branches: [ "sales-app-v1" ]
    paths:
      - "sales-app/**"
      - "supabase/**"
      - ".github/workflows/sales-production-gate.yml"

jobs:
  production-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: https://gtgnwasijweewmaubvyg.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_cbTtSEhcXsHKDdldocSw3Q_bTcfXtaW
      SALES_KEYSTORE_B64: ${{ secrets.SALES_KEYSTORE_B64 }}
      SALES_KEYSTORE_PASSWORD: ${{ secrets.SALES_KEYSTORE_PASSWORD }}
      SALES_KEY_ALIAS: ${{ secrets.SALES_KEY_ALIAS }}
      SALES_KEY_PASSWORD: ${{ secrets.SALES_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject incomplete signing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in SALES_KEYSTORE_B64 SALES_KEYSTORE_PASSWORD SALES_KEY_ALIAS SALES_KEY_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::$v is not configured"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Production Final is blocked until GMU signing secrets are configured."
            exit 1
          fi

      - name: Verify production Sales v6.5 release health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$SUPABASE_URL/rest/v1/rpc/gmu_sales_release_health_v65" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' >/tmp/sales-release-health.json

          jq -e '
            .healthy == true and
            .e2e_healthy == true and
            .catalog_ready == true and
            .pricing_contract_ready == true and
            .contract_version == "sales-v6.5/v22.6"
          ' /tmp/sales-release-health.json >/dev/null || {
            echo "::error::Sales v6.5 backend release health is not green"
            cat /tmp/sales-release-health.json
            exit 1
          }

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Use exact GMU EduTrans logo
        shell: bash
        run: |
          set -euo pipefail
          rm -f sales-app/src/main/res/drawable/sales_logo.xml
          curl -fsSL "$SUPABASE_URL/functions/v1/gmu-logo" -o sales-app/src/main/res/drawable/sales_logo.jpg
          file sales-app/src/main/res/drawable/sales_logo.jpg

      - name: Build release APK
        run: gradle --no-daemon :sales-app:assembleRelease

      - name: Sign and verify official GMU release
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="sales-app/build/outputs/apk/release/sales-app-release-unsigned.apk"
          test -f "$UNSIGNED"
          echo "$SALES_KEYSTORE_B64" | base64 --decode > /tmp/gmu-sales-release.p12
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/GMU-EduTrans-Sales-v6.5.0-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/gmu-sales-release.p12 \
            --ks-type PKCS12 \
            --ks-pass "pass:$SALES_KEYSTORE_PASSWORD" \
            --ks-key-alias "$SALES_KEY_ALIAS" \
            --key-pass "pass:$SALES_KEY_PASSWORD" \
            --out /tmp/GMU-EduTrans-Sales-v6.5.0-PRODUCTION.apk \
            /tmp/GMU-EduTrans-Sales-v6.5.0-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/GMU-EduTrans-Sales-v6.5.0-PRODUCTION.apk
          sha256sum /tmp/GMU-EduTrans-Sales-v6.5.0-PRODUCTION.apk > /tmp/GMU-EduTrans-Sales-v6.5.0-PRODUCTION.sha256
          rm -f /tmp/gmu-sales-release.p12 /tmp/GMU-EduTrans-Sales-v6.5.0-aligned.apk

      - name: Upload Production Final APK
        uses: actions/upload-artifact@v4
        with:
          name: GMU-EduTrans-Sales-v6.5.0-PRODUCTION
          path: |
            /tmp/GMU-EduTrans-Sales-v6.5.0-PRODUCTION.apk
            /tmp/GMU-EduTrans-Sales-v6.5.0-PRODUCTION.sha256
          if-no-files-found: error
          retention-days: 30
