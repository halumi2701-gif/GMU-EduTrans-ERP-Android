name: GAWONE Customer RC12 Mobility Foundation

on:
  push:
    branches:
      - gawone-customer-production-build
    paths:
      - "gawone-customer-rc5-e2e-pilot.py"
      - "gawone-customer-rc6-auth-fallback.py"
      - "gawone-customer-rc7-uiux-v2.py"
      - "gawone-customer-rc8-uiux-v3.py"
      - "gawone-customer-rc9-reliability.py"
      - "gawone-customer-rc10-nine-services.py"
      - "gawone-customer-rc11-five-service-canary.py"
      - "gawone-customer-rc12-mobility-foundation.py"
      - ".github/workflows/gawone-customer-auth-fallback.yml"
      - "gawone-customer-rc2-src.*"
      - "gawone-customer-rc2-to-rc3.patch.gz.b64"
      - "gawone-customer-rc3-to-rc4.patch.gz.b64"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct proven RC2 source
        shell: bash
        run: |
          cat gawone-customer-rc2-src.00 gawone-customer-rc2-src.01 gawone-customer-rc2-src.02 > /tmp/customer-rc2.b64
          base64 -d /tmp/customer-rc2.b64 > /tmp/customer-rc2.zip
          unzip -q /tmp/customer-rc2.zip
          test -f gawone-customer-production/app/build.gradle.kts

      - name: Apply proven RC3
        shell: bash
        run: |
          base64 -d gawone-customer-rc2-to-rc3.patch.gz.b64 | gunzip > /tmp/rc3.patch
          cd gawone-customer-production
          patch -p4 < /tmp/rc3.patch
          cd ..
          python gawone-customer-rc3-compile-fix.py
          python gawone-customer-rc3-static-hardening.py

      - name: Apply proven RC4 runtime gates
        shell: bash
        run: |
          base64 -d gawone-customer-rc3-to-rc4.patch.gz.b64 | gunzip > /tmp/rc4.patch
          patch -p1 < /tmp/rc4.patch
          grep -q 'versionCode = 13' gawone-customer-production/app/build.gradle.kts

      - name: Apply RC5 E2E pilot
        run: python gawone-customer-rc5-e2e-pilot.py

      - name: Apply RC6 auth fallback
        run: |
          python gawone-customer-rc6-auth-fallback.py
          grep -q 'versionCode = 15' gawone-customer-production/app/build.gradle.kts

      - name: Apply RC7 UIUX V2
        run: |
          python gawone-customer-rc7-uiux-v2.py
          grep -q 'versionCode = 16' gawone-customer-production/app/build.gradle.kts

      - name: Apply RC8 UIUX V3
        run: |
          python gawone-customer-rc8-uiux-v3.py
          grep -q 'versionCode = 17' gawone-customer-production/app/build.gradle.kts
          grep -q 'GAWONE Live' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt

      - name: Apply RC9 reliability
        run: |
          python gawone-customer-rc9-reliability.py
          grep -q 'versionCode = 18' gawone-customer-production/app/build.gradle.kts
          grep -q 'object GawoneCustomerFailureMapper' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/GawoneCustomerFailure.kt

      - name: Apply RC10 nine-service catalog
        run: |
          python gawone-customer-rc10-nine-services.py
          grep -q 'versionCode = 19' gawone-customer-production/app/build.gradle.kts
          grep -q '9 layanan GAWONE' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt

      - name: Apply RC11 five-service canary
        shell: bash
        run: |
          python gawone-customer-rc11-five-service-canary.py
          grep -q 'versionCode = 20' gawone-customer-production/app/build.gradle.kts
          grep -q 'versionName = "1.0.10-five-service-canary-rc11"' gawone-customer-production/app/build.gradle.kts
          grep -q 'controlledPilotCodes=setOf("CLEANING","HANDYMAN","HELPER","TECHNICIAN","DRIVER")' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt

      - name: Apply RC12 mobility trust foundation
        shell: bash
        run: |
          python gawone-customer-rc12-mobility-foundation.py
          grep -q 'versionCode = 21' gawone-customer-production/app/build.gradle.kts
          grep -q 'versionName = "1.0.11-mobility-foundation-rc12"' gawone-customer-production/app/build.gradle.kts
          grep -q 'featureEnabled(runtime,"MOBILITY")' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          grep -q 'get_my_order_route_metric' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/CustomerRepository.kt
          grep -q 'MOBILITY_ENDPOINTS_REQUIRED' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/CustomerRepository.kt
          grep -q 'TRUSTED_ROUTE_PENDING' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/GawoneCustomerFailure.kt
          zip -qr GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_SOURCE.zip gawone-customer-production

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Lint and build release APK
        working-directory: gawone-customer-production
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify RC12 APK
        shell: bash
        run: |
          APK=gawone-customer-production/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12.apk
          unzip -t GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12.apk >/dev/null
          sha256sum GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12.apk | tee GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12.apk > GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_BADGING.txt
          grep -q "package: name='site.garsyanimultiusaha.gawone' versionCode='21' versionName='1.0.11-mobility-foundation-rc12'" GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12.apk > GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_SIGNATURE.txt
          test -f gawone-customer-production/app/build/reports/lint-results-release.html

      - uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12
          if-no-files-found: error
          retention-days: 14
          path: |
            GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12.apk
            GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_SHA256.txt
            GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_SOURCE.zip
            GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_BADGING.txt
            GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_SIGNATURE.txt
            gawone-customer-production/app/build/reports/lint-results-release.html

  emulator_smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12

      - name: Prepare RC12 smoke script
        shell: bash
        run: |
          mkdir -p emulator-reports
          sed -e 's/GAWONE_Customer_v1.0.3_RC4.apk/GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12.apk/g' -e 's/RC4 emulator production-prep gate/RC12 mobility emulator gate/g' gawone-customer-emulator-smoke.sh > /tmp/gawone-customer-rc12-smoke.sh
          chmod +x /tmp/gawone-customer-rc12-smoke.sh

      - name: RC12 Android emulator gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-window -dns-server 8.8.8.8
          script: bash /tmp/gawone-customer-rc12-smoke.sh

      - name: Upload RC12 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.11_MOBILITY_FOUNDATION_RC12_EMULATOR_GATE
          if-no-files-found: warn
          retention-days: 90
          path: emulator-reports
