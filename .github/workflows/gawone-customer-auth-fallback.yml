name: GAWONE Customer RC8 UIUX V3

on:
  push:
    branches:
      - gawone-customer-production-build
    paths:
      - "gawone-customer-rc6-auth-fallback.py"
      - "gawone-customer-rc7-uiux-v2.py"
      - "gawone-customer-rc8-uiux-v3.py"
      - ".github/workflows/gawone-customer-auth-fallback.yml"
      - "gawone-customer-rc5-e2e-pilot.py"
      - "gawone-customer-rc2-src.*"
      - "gawone-customer-rc2-to-rc3.patch.gz.b64"
      - "gawone-customer-rc3-to-rc4.patch.gz.b64"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct proven RC2 source
        shell: bash
        run: |
          cat gawone-customer-rc2-src.00 gawone-customer-rc2-src.01 gawone-customer-rc2-src.02 > /tmp/customer-rc2.b64
          base64 -d /tmp/customer-rc2.b64 > /tmp/customer-rc2.zip
          unzip -q /tmp/customer-rc2.zip
          test -f gawone-customer-production/app/build.gradle.kts

      - name: Apply proven RC3
        shell: bash
        run: |
          base64 -d gawone-customer-rc2-to-rc3.patch.gz.b64 | gunzip > /tmp/rc3.patch
          cd gawone-customer-production
          patch -p4 < /tmp/rc3.patch
          cd ..
          python gawone-customer-rc3-compile-fix.py
          python gawone-customer-rc3-static-hardening.py

      - name: Apply proven RC4 runtime gates
        shell: bash
        run: |
          base64 -d gawone-customer-rc3-to-rc4.patch.gz.b64 | gunzip > /tmp/rc4.patch
          patch -p1 < /tmp/rc4.patch
          grep -q 'versionCode = 13' gawone-customer-production/app/build.gradle.kts

      - name: Apply RC5 E2E pilot
        run: python gawone-customer-rc5-e2e-pilot.py

      - name: Apply RC6 auth fallback
        shell: bash
        run: |
          python gawone-customer-rc6-auth-fallback.py
          grep -q 'versionCode = 15' gawone-customer-production/app/build.gradle.kts
          grep -q 'suspend fun signInEmail' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/SupabaseApi.kt
          grep -q 'suspend fun signUpEmail' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/SupabaseApi.kt

      - name: Apply RC7 UIUX V2
        shell: bash
        run: |
          python gawone-customer-rc7-uiux-v2.py
          grep -q 'versionCode = 16' gawone-customer-production/app/build.gradle.kts
          grep -q 'versionName = "1.0.6-uiux-v2"' gawone-customer-production/app/build.gradle.kts

      - name: Apply RC8 UIUX V3 live journey
        shell: bash
        run: |
          python gawone-customer-rc8-uiux-v3.py
          grep -q 'versionCode = 17' gawone-customer-production/app/build.gradle.kts
          grep -q 'versionName = "1.0.7-uiux-v3"' gawone-customer-production/app/build.gradle.kts
          grep -q 'GAWONE Live' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          grep -q 'Perjalanan pesanan' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          grep -q 'Satu status di semua aplikasi' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          zip -qr GAWONE_Customer_v1.0.7_UIUX_V3_SOURCE.zip gawone-customer-production

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Lint and build release test APK
        working-directory: gawone-customer-production
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify RC8 APK
        shell: bash
        run: |
          APK=gawone-customer-production/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" GAWONE_Customer_v1.0.7_UIUX_V3.apk
          unzip -t GAWONE_Customer_v1.0.7_UIUX_V3.apk >/dev/null
          sha256sum GAWONE_Customer_v1.0.7_UIUX_V3.apk | tee GAWONE_Customer_v1.0.7_UIUX_V3_SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GAWONE_Customer_v1.0.7_UIUX_V3.apk > GAWONE_Customer_v1.0.7_UIUX_V3_BADGING.txt
          grep -q "package: name='site.garsyanimultiusaha.gawone' versionCode='17' versionName='1.0.7-uiux-v3'" GAWONE_Customer_v1.0.7_UIUX_V3_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GAWONE_Customer_v1.0.7_UIUX_V3.apk > GAWONE_Customer_v1.0.7_UIUX_V3_SIGNATURE.txt
          test -f gawone-customer-production/app/build/reports/lint-results-release.html

      - uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.7_UIUX_V3
          if-no-files-found: error
          retention-days: 14
          path: |
            GAWONE_Customer_v1.0.7_UIUX_V3.apk
            GAWONE_Customer_v1.0.7_UIUX_V3_SHA256.txt
            GAWONE_Customer_v1.0.7_UIUX_V3_SOURCE.zip
            GAWONE_Customer_v1.0.7_UIUX_V3_BADGING.txt
            GAWONE_Customer_v1.0.7_UIUX_V3_SIGNATURE.txt
            gawone-customer-production/app/build/reports/lint-results-release.html
