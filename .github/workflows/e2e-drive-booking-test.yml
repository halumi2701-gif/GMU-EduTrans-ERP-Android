name: E2E Test ERP Booking to Google Drive

on:
  push:
    branches: ["main"]
    paths:
      - ".github/gmu-drive-e2e-once"

permissions:
  contents: read

concurrency:
  group: gmu-edutrans-drive-e2e
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: gtgnwasijweewmaubvyg
  SUPABASE_URL: https://gtgnwasijweewmaubvyg.supabase.co
  SUPABASE_DB_POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com
  EXPECTED_ORDER_PARENT_ID: 1eLza3RKK7sMPuHF55k1V8G09_KN9rPJR

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${GOOGLE_DRIVE_CLIENT_ID:-}"
          test -n "${GOOGLE_DRIVE_CLIENT_SECRET:-}"
          test -n "${GOOGLE_DRIVE_REFRESH_TOKEN:-}"

      - name: Run self-cleaning ERP booking to Drive E2E
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client >/dev/null
          fi

          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          DB_CONN="host=$SUPABASE_DB_POOLER_HOST port=5432 dbname=postgres user=postgres.$SUPABASE_PROJECT_ID sslmode=require"

          TEST_EMAIL="gmu-e2e-drive-$(date +%s)@example.com"
          TEST_PASSWORD="$(python3 - <<'PY'
import secrets,string
alphabet=string.ascii_letters+string.digits
print('E2E-'+''.join(secrets.choice(alphabet) for _ in range(32)))
PY
)"
          echo "::add-mask::$TEST_PASSWORD"

          USER_ID=""
          BOOKING_ID=""
          BOOKING_NO=""
          DRIVE_FOLDER_ID=""
          ADMIN_KEY=""
          PUBLISHABLE_KEY=""
          GOOGLE_ACCESS_TOKEN=""

          cleanup() {
            set +e
            if [ -n "$DRIVE_FOLDER_ID" ] && [ -n "$GOOGLE_ACCESS_TOKEN" ]; then
              curl -sS -X DELETE                 -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"                 "https://www.googleapis.com/drive/v3/files/$DRIVE_FOLDER_ID?supportsAllDrives=true" >/dev/null 2>&1
            fi
            if [ -n "$BOOKING_NO" ]; then
              psql "$DB_CONN" -v ON_ERROR_STOP=0 -c "delete from public.gmu_drive_documents where entity_type='order' and entity_id='$(printf "%s" "$BOOKING_NO" | sed "s/'/''/g")';" >/dev/null 2>&1
              psql "$DB_CONN" -v ON_ERROR_STOP=0 -c "delete from public.gmu_drive_folders where entity_type='order' and entity_id='$(printf "%s" "$BOOKING_NO" | sed "s/'/''/g")';" >/dev/null 2>&1
            fi
            if [ -n "$BOOKING_ID" ]; then
              psql "$DB_CONN" -v ON_ERROR_STOP=0 -c "delete from public.bookings where id='$BOOKING_ID'::uuid;" >/dev/null 2>&1
            fi
            if [ -n "$USER_ID" ]; then
              psql "$DB_CONN" -v ON_ERROR_STOP=0 -c "delete from public.profiles where id='$USER_ID'::uuid;" >/dev/null 2>&1
              if [ -n "$ADMIN_KEY" ]; then
                if [[ "$ADMIN_KEY" == eyJ* ]]; then
                  curl -sS -X DELETE                     -H "apikey: $ADMIN_KEY"                     -H "Authorization: Bearer $ADMIN_KEY"                     "$SUPABASE_URL/auth/v1/admin/users/$USER_ID" >/dev/null 2>&1
                else
                  curl -sS -X DELETE                     -H "apikey: $ADMIN_KEY"                     "$SUPABASE_URL/auth/v1/admin/users/$USER_ID" >/dev/null 2>&1
                fi
              fi
            fi
            unset PGPASSWORD
          }
          trap cleanup EXIT

          echo "1/8 Mengambil API keys production secara aman..."
          curl -fsS             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -o /tmp/api-keys.json

          python3 - <<'PY'
import json
d=json.load(open('/tmp/api-keys.json'))
items=d if isinstance(d,list) else d.get('api_keys') or d.get('keys') or d.get('data') or []
admin=''
pub=''
for x in items:
    if not isinstance(x,dict): continue
    name=str(x.get('name','')).lower()
    typ=str(x.get('type','')).lower()
    key=x.get('api_key') or x.get('key') or x.get('value') or ''
    if not key: continue
    if name=='service_role':
        admin=key
    elif typ=='secret' and not admin:
        admin=key
    if typ=='publishable':
        pub=key
    elif name=='anon' and not pub:
        pub=key
if not admin or not pub:
    raise SystemExit('API key admin/publishable tidak ditemukan dari Management API.')
open('/tmp/admin-key','w').write(admin)
open('/tmp/pub-key','w').write(pub)
PY
          ADMIN_KEY="$(cat /tmp/admin-key)"
          PUBLISHABLE_KEY="$(cat /tmp/pub-key)"
          echo "::add-mask::$ADMIN_KEY"
          echo "::add-mask::$PUBLISHABLE_KEY"

          echo "2/8 Membuat user ERP uji sementara..."
          CREATE_USER_BODY="$(python3 - "$TEST_EMAIL" "$TEST_PASSWORD" <<'PY'
import json,sys
print(json.dumps({"email":sys.argv[1],"password":sys.argv[2],"email_confirm":True}))
PY
)"
          if [[ "$ADMIN_KEY" == eyJ* ]]; then
            curl -fsS -X POST               -H "apikey: $ADMIN_KEY"               -H "Authorization: Bearer $ADMIN_KEY"               -H "Content-Type: application/json"               --data "$CREATE_USER_BODY"               "$SUPABASE_URL/auth/v1/admin/users"               -o /tmp/new-user.json
          else
            curl -fsS -X POST               -H "apikey: $ADMIN_KEY"               -H "Content-Type: application/json"               --data "$CREATE_USER_BODY"               "$SUPABASE_URL/auth/v1/admin/users"               -o /tmp/new-user.json
          fi
          USER_ID="$(python3 -c 'import json; print(json.load(open("/tmp/new-user.json")).get("id",""))')"
          test -n "$USER_ID" || { cat /tmp/new-user.json; exit 1; }

          PROFILE_EXISTS="$(psql "$DB_CONN" -Atc "select exists(select 1 from public.profiles where id='$USER_ID'::uuid);")"
          test "$PROFILE_EXISTS" = "t" || { echo "Trigger profile untuk Auth user tidak tersedia; test dibatalkan aman."; exit 1; }
          psql "$DB_CONN" -v ON_ERROR_STOP=1 -c "update public.profiles set role='Admin', is_active=true where id='$USER_ID'::uuid;" >/dev/null

          echo "3/8 Login sebagai user ERP uji melalui Supabase Auth..."
          LOGIN_BODY="$(python3 - "$TEST_EMAIL" "$TEST_PASSWORD" <<'PY'
import json,sys
print(json.dumps({"email":sys.argv[1],"password":sys.argv[2]}))
PY
)"
          curl -fsS -X POST             -H "apikey: $PUBLISHABLE_KEY"             -H "Content-Type: application/json"             --data "$LOGIN_BODY"             "$SUPABASE_URL/auth/v1/token?grant_type=password"             -o /tmp/login.json
          USER_ACCESS_TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/login.json")).get("access_token",""))')"
          test -n "$USER_ACCESS_TOKEN" || { cat /tmp/login.json; exit 1; }
          echo "::add-mask::$USER_ACCESS_TOKEN"

          echo "4/8 Memilih customer produksi hanya sebagai referensi, tanpa mengubah data customer..."
          CUSTOMER_ID="$(psql "$DB_CONN" -Atc "select id from public.customers order by created_at asc nulls last limit 1;")"
          test -n "$CUSTOMER_ID" || { echo "Tidak ada customer untuk test booking."; exit 1; }
          CUSTOMER_NAME="$(psql "$DB_CONN" -Atc "select coalesce(nullif(trim(name),''),'CUSTOMER') from public.customers where id='$CUSTOMER_ID'::uuid limit 1;")"
          TEST_DATE="$(date -u -d '+30 days' +%F)"

          echo "5/8 Membuat booking melalui RPC yang sama dengan aplikasi Android..."
          RPC_BODY="$(python3 - "$CUSTOMER_ID" "$TEST_DATE" <<'PY'
import json,sys
print(json.dumps({
 "p_customer_id":sys.argv[1],
 "p_package_code":"STATION-PROF-2026",
 "p_trip_date":sys.argv[2],
 "p_booking_pax":20,
 "p_channel":"DIRECT_PUBLIC",
 "p_partner_id":None,
 "p_session_type":"PRIVATE",
 "p_pricing_pax":20,
 "p_status":"Lead",
 "p_participant_group":"SYSTEM E2E GOOGLE DRIVE TEST",
 "p_meeting_point":"CI TEST ONLY",
 "p_shared_session_code":None
}))
PY
)"
          curl -fsS -X POST             -H "apikey: $PUBLISHABLE_KEY"             -H "Authorization: Bearer $USER_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data "$RPC_BODY"             "$SUPABASE_URL/rest/v1/rpc/create_sales_booking_v226"             -o /tmp/booking.json
          BOOKING_ID="$(python3 -c 'import json; d=json.load(open("/tmp/booking.json")); print(d.get("booking_id",""))')"
          BOOKING_NO="$(python3 -c 'import json; d=json.load(open("/tmp/booking.json")); print(d.get("booking_no",""))')"
          test -n "$BOOKING_ID" && test -n "$BOOKING_NO" || { cat /tmp/booking.json; exit 1; }

          echo "6/8 Memanggil Edge Function Drive persis seperti aplikasi..."
          DRIVE_BODY="$(python3 - "$BOOKING_NO" "$CUSTOMER_NAME" "$TEST_DATE" <<'PY'
import json,sys
print(json.dumps({
 "action":"ensure_order_folder",
 "entity_id":sys.argv[1],
 "booking_code":sys.argv[1],
 "customer_name":sys.argv[2],
 "activity_date":sys.argv[3]
}))
PY
)"
          curl -fsS -X POST             -H "apikey: $PUBLISHABLE_KEY"             -H "Authorization: Bearer $USER_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data "$DRIVE_BODY"             "$SUPABASE_URL/functions/v1/gmu-drive-archive"             -o /tmp/drive.json

          python3 - <<'PY'
import json
d=json.load(open('/tmp/drive.json'))
if not d.get('ok'):
    raise SystemExit('Edge Function tidak mengembalikan ok=true: '+json.dumps(d))
f=d.get('folder') or {}
children=((f.get('metadata') or {}).get('children') or {})
expected=[
"01 - PENAWARAN","02 - BOOKING","03 - PEMBAYARAN","04 - DATA PESERTA",
"05 - OPERASIONAL","06 - TIKET","07 - DOKUMENTASI","08 - LAPORAN","09 - DOKUMEN FINAL"
]
missing=[x for x in expected if not children.get(x)]
if missing:
    raise SystemExit('Metadata child folder kurang: '+', '.join(missing))
open('/tmp/drive-folder-id','w').write(str(f.get('drive_folder_id','')))
open('/tmp/drive-folder-name','w').write(str(f.get('folder_name','')))
PY
          DRIVE_FOLDER_ID="$(cat /tmp/drive-folder-id)"
          test -n "$DRIVE_FOLDER_ID"

          echo "7/8 Verifikasi folder fisik langsung ke Google Drive API..."
          TOKEN_HTTP="$(curl -sS -o /tmp/google-token.json -w '%{http_code}'             https://oauth2.googleapis.com/token             --data-urlencode "client_id=$GOOGLE_DRIVE_CLIENT_ID"             --data-urlencode "client_secret=$GOOGLE_DRIVE_CLIENT_SECRET"             --data-urlencode "refresh_token=$GOOGLE_DRIVE_REFRESH_TOKEN"             --data-urlencode "grant_type=refresh_token")"
          test "$TOKEN_HTTP" = "200" || { cat /tmp/google-token.json; exit 1; }
          GOOGLE_ACCESS_TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/google-token.json")).get("access_token",""))')"
          test -n "$GOOGLE_ACCESS_TOKEN"
          echo "::add-mask::$GOOGLE_ACCESS_TOKEN"

          curl -fsS             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             "https://www.googleapis.com/drive/v3/files/$DRIVE_FOLDER_ID?fields=id,name,parents,trashed"             -o /tmp/root-folder.json

          ROOT_PARENT_OK="$(python3 - "$EXPECTED_ORDER_PARENT_ID" <<'PY'
import json,sys
d=json.load(open('/tmp/root-folder.json'))
print('t' if (not d.get('trashed',False) and sys.argv[1] in (d.get('parents') or [])) else 'f')
PY
)"
          test "$ROOT_PARENT_OK" = "t" || { cat /tmp/root-folder.json; exit 1; }

          curl -fsS -G             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             --data-urlencode "q='$DRIVE_FOLDER_ID' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false"             --data-urlencode "fields=files(id,name,parents,trashed)"             --data-urlencode "pageSize=100"             "https://www.googleapis.com/drive/v3/files"             -o /tmp/children.json

          python3 - <<'PY'
import json
expected={
"01 - PENAWARAN","02 - BOOKING","03 - PEMBAYARAN","04 - DATA PESERTA",
"05 - OPERASIONAL","06 - TIKET","07 - DOKUMENTASI","08 - LAPORAN","09 - DOKUMEN FINAL"
}
d=json.load(open('/tmp/children.json'))
names={x.get('name') for x in d.get('files',[])}
missing=sorted(expected-names)
if missing:
    raise SystemExit('Folder fisik Drive kurang: '+', '.join(missing))
if len(expected & names) != 9:
    raise SystemExit('Jumlah subfolder expected bukan 9.')
print('VERIFIED_SUBFOLDERS=9')
PY

          DB_LINK_OK="$(psql "$DB_CONN" -Atc "select exists(select 1 from public.gmu_drive_folders where entity_type='order' and entity_id='$(printf "%s" "$BOOKING_NO" | sed "s/'/''/g")' and drive_folder_id='$(printf "%s" "$DRIVE_FOLDER_ID" | sed "s/'/''/g")');")"
          test "$DB_LINK_OK" = "t" || { echo "Record gmu_drive_folders tidak cocok."; exit 1; }

          echo "8/8 E2E VERIFIED"
          echo "E2E_RESULT=PASS"
          echo "BOOKING_NO=$BOOKING_NO"
          echo "DRIVE_FOLDER_NAME=$(cat /tmp/drive-folder-name)"
          echo "SUBFOLDERS_VERIFIED=9"
          echo "CLEANUP=automatic-on-exit"
