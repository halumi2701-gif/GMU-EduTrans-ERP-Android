name: GAWONE Customer Production RC3

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct proven RC2 source
        shell: bash
        run: |
          cat gawone-customer-rc2-src.00 gawone-customer-rc2-src.01 gawone-customer-rc2-src.02 > gawone-customer-rc2-source.b64
          base64 -d gawone-customer-rc2-source.b64 > GAWONE_Customer_v1.0.1_RC2_SOURCE.zip
          unzip -q GAWONE_Customer_v1.0.1_RC2_SOURCE.zip
          test -f gawone-customer-production/app/build.gradle.kts
          grep -q 'versionCode = 11' gawone-customer-production/app/build.gradle.kts

      - name: Apply RC3 hardening
        shell: bash
        run: |
          base64 -d gawone-customer-rc2-to-rc3.patch.gz.b64 | gunzip > /tmp/rc3.patch
          test -s /tmp/rc3.patch
          cd gawone-customer-production
          patch --dry-run -p4 < /tmp/rc3.patch >/dev/null
          patch -p4 < /tmp/rc3.patch
          cd ..
          python gawone-customer-rc3-compile-fix.py
          python gawone-customer-rc3-static-hardening.py
          grep -q 'versionCode = 12' gawone-customer-production/app/build.gradle.kts
          grep -q 'versionName = "1.0.2-customer-rc3"' gawone-customer-production/app/build.gradle.kts
          grep -q 'class CustomerOfflineQueue' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/CustomerOfflineQueue.kt
          grep -q 'AndroidKeyStore' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/CustomerOfflineQueue.kt
          grep -q 'onNewIntent' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          grep -q 'flushPendingChat' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/CustomerRepository.kt
          grep -q 'android:icon="@mipmap/ic_launcher"' gawone-customer-production/app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' gawone-customer-production/app/src/main/AndroidManifest.xml
          grep -q '<string name="app_name">GAWONE Customer</string>' gawone-customer-production/app/src/main/res/values/strings.xml
          rm -f GAWONE_Customer_v1.0.1_RC2_SOURCE.zip
          zip -qr GAWONE_Customer_v1.0.2_RC3_SOURCE.zip gawone-customer-production

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Static QA and compile
        working-directory: gawone-customer-production
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify RC3 APK
        shell: bash
        run: |
          APK=gawone-customer-production/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" GAWONE_Customer_v1.0.2_RC3.apk
          unzip -t GAWONE_Customer_v1.0.2_RC3.apk >/dev/null
          sha256sum GAWONE_Customer_v1.0.2_RC3.apk | tee GAWONE_Customer_v1.0.2_RC3_SHA256.txt
          grep -R "Simulasikan" gawone-customer-production/app/src/main && exit 1 || true
          grep -R "Jl. Suroso" gawone-customer-production/app/src/main/java && exit 1 || true
          REPORT=gawone-customer-production/app/build/reports/lint-results-release.html
          test -f "$REPORT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GAWONE_Customer_v1.0.2_RC3.apk > GAWONE_Customer_v1.0.2_RC3_BADGING.txt
          grep -q "package: name='site.garsyanimultiusaha.gawone' versionCode='12' versionName='1.0.2-customer-rc3'" GAWONE_Customer_v1.0.2_RC3_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GAWONE_Customer_v1.0.2_RC3.apk > GAWONE_Customer_v1.0.2_RC3_SIGNATURE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.2_RC3
          if-no-files-found: error
          path: |
            GAWONE_Customer_v1.0.2_RC3.apk
            GAWONE_Customer_v1.0.2_RC3_SHA256.txt
            GAWONE_Customer_v1.0.2_RC3_SOURCE.zip
            GAWONE_Customer_v1.0.2_RC3_BADGING.txt
            GAWONE_Customer_v1.0.2_RC3_SIGNATURE.txt
            gawone-customer-production/app/build/reports/lint-results-release.html


  emulator_smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.2_RC3

      - name: Prepare emulator reports
        shell: bash
        run: mkdir -p emulator-reports

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: RC3 Android emulator smoke gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: bash gawone-customer-emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAWONE_Customer_v1.0.2_RC3_EMULATOR_GATE
          if-no-files-found: warn
          path: emulator-reports
