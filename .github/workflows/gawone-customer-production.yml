name: GAWONE Customer Legacy RC4 Compile

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# This workflow preserves the historical RC4 reconstruction/compile gate only.
# Current Android emulator coverage is owned by the cumulative RC17 P2 workflow.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct proven RC2 source
        shell: bash
        run: |
          cat gawone-customer-rc2-src.00 gawone-customer-rc2-src.01 gawone-customer-rc2-src.02 > gawone-customer-rc2-source.b64
          base64 -d gawone-customer-rc2-source.b64 > GAWONE_Customer_v1.0.1_RC2_SOURCE.zip
          unzip -q GAWONE_Customer_v1.0.1_RC2_SOURCE.zip
          test -f gawone-customer-production/app/build.gradle.kts
          grep -q 'versionCode = 11' gawone-customer-production/app/build.gradle.kts

      - name: Apply proven RC3 hardening
        shell: bash
        run: |
          base64 -d gawone-customer-rc2-to-rc3.patch.gz.b64 | gunzip > /tmp/rc3.patch
          test -s /tmp/rc3.patch
          cd gawone-customer-production
          patch --dry-run -p4 < /tmp/rc3.patch >/dev/null
          patch -p4 < /tmp/rc3.patch
          cd ..
          python gawone-customer-rc3-compile-fix.py
          python gawone-customer-rc3-static-hardening.py
          grep -q 'versionCode = 12' gawone-customer-production/app/build.gradle.kts

      - name: Apply RC4 production runtime gates
        shell: bash
        run: |
          base64 -d gawone-customer-rc3-to-rc4.patch.gz.b64 | gunzip > /tmp/rc4.patch
          patch --dry-run -p1 < /tmp/rc4.patch >/dev/null
          patch -p1 < /tmp/rc4.patch
          grep -q 'versionCode = 13' gawone-customer-production/app/build.gradle.kts
          grep -q 'versionName = "1.0.3-customer-rc4"' gawone-customer-production/app/build.gradle.kts
          grep -q 'class RuntimeConfigStore' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/RuntimeConfigStore.kt
          grep -q 'featureEnabled(runtime,"BOOKING")' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          grep -q 'featureEnabled(runtime,"MATCHING")' gawone-customer-production/app/src/main/java/site/garsyanimultiusaha/gawone/MainActivity.kt
          rm -f GAWONE_Customer_v1.0.1_RC2_SOURCE.zip

      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}

      - name: Install Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}

      - name: Static QA and compile
        working-directory: gawone-customer-production
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify RC4 APK
        shell: bash
        run: |
          APK=gawone-customer-production/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" GAWONE_Customer_v1.0.3_RC4.apk
          unzip -t GAWONE_Customer_v1.0.3_RC4.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GAWONE_Customer_v1.0.3_RC4.apk > GAWONE_Customer_v1.0.3_RC4_BADGING.txt
          grep -q "package: name='site.garsyanimultiusaha.gawone' versionCode='13' versionName='1.0.3-customer-rc4'" GAWONE_Customer_v1.0.3_RC4_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GAWONE_Customer_v1.0.3_RC4.apk > GAWONE_Customer_v1.0.3_RC4_SIGNATURE.txt
