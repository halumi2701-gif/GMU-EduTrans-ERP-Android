name: One-time Core Module Split

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-core-modules-once.yml'

permissions:
  contents: write

jobs:
  split-core-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split CoreModules by ERP domain
        shell: python
        run: |
          from pathlib import Path

          root = Path('app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp')
          source = root / 'CoreModules.kt'
          lines = source.read_text(encoding='utf-8').splitlines(keepends=True)

          # Guard against silently slicing a changed file.
          checks = {
              20: '@Composable',
              391: 'fun BookingScreen',
              847: 'private fun DetailLine',
              857: 'fun FinanceScreen',
              1077: 'private fun AddCustomerDialog',
              1112: 'private fun AddBookingDialog',
              1174: 'private fun FinanceEntryDialog',
              1235: 'fun GmuField',
          }
          for line_no, needle in checks.items():
              actual = lines[line_no - 1] if line_no <= len(lines) else ''
              if needle not in actual:
                  raise SystemExit(f'CoreModules guard failed at line {line_no}: expected {needle!r}, got {actual!r}')

          header = ''.join(lines[:18]).rstrip() + '\n\n'

          def take(start, end=None):
              if end is None:
                  return ''.join(lines[start - 1:]).strip()
              return ''.join(lines[start - 1:end]).strip()

          dashboard = header + take(20, 389) + '\n'
          sales = header + take(390, 844) + '\n\n' + take(1076, 1171) + '\n'
          finance = header + take(855, 1074) + '\n\n' + take(1173, 1232) + '\n'
          shared = (
              header
              + take(846, 853).replace('private fun DetailLine', 'fun DetailLine')
              + '\n\n'
              + take(1234)
              + '\n'
          )

          outputs = {
              'DashboardCoreScreens.kt': dashboard,
              'SalesCoreScreens.kt': sales,
              'FinanceCoreScreens.kt': finance,
              'SharedCoreUi.kt': shared,
          }
          for name, content in outputs.items():
              (root / name).write_text(content, encoding='utf-8')

          source.unlink()

          # This workflow is intentionally self-removing after the successful split.
          Path('.github/workflows/refactor-core-modules-once.yml').unlink()

      - name: Verify split signatures
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/CoreModules.kt
          grep -q 'fun DashboardScreen' app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/DashboardCoreScreens.kt
          grep -q 'fun BookingScreen' app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/SalesCoreScreens.kt
          grep -q 'fun FinanceScreen' app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/FinanceCoreScreens.kt
          grep -q 'fun GmuField' app/src/main/java/com/garsyanimultiusaha/gmuedutrans/erp/SharedCoreUi.kt

      - name: Commit domain split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GMU EduTrans Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(android): split core screens by ERP domain'
          git push origin HEAD:main
