plugins {
    id "com.android.application"
}

android {
    namespace "com.pamoyanan.one.nativeapp"
    compileSdk 35

    defaultConfig {
        applicationId "com.pamoyanan.one.nativeapp"
        minSdk 24
        targetSdk 35
        versionCode 67104
        versionName "6.7.1-v4"
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
