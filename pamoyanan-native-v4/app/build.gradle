plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.pamoyanan.one"
    compileSdk 35

    defaultConfig {
        applicationId "com.pamoyanan.one"
        minSdk 24
        targetSdk 35
        versionCode 200203
        versionName "20.2.3-diagnostic"
        buildConfigField "String", "API_BASE_URL", "\"https://pamoyanan-one-rw01.vercel.app/api/v1\""
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    debugImplementation "androidx.compose.ui:ui-tooling"
}


def decodedLogoDir = layout.buildDirectory.dir("generated/pamoyananLogo/res")
android.sourceSets.main.res.srcDir(decodedLogoDir)

tasks.register("decodePamoyananLogo") {
    inputs.file(file("src/main/assets/logo_rw01.b64"))
    outputs.file(decodedLogoDir.map { it.file("drawable/logo_rw01.webp") })
    doLast {
        def out = decodedLogoDir.get().file("drawable/logo_rw01.webp").asFile
        out.parentFile.mkdirs()
        out.bytes = file("src/main/assets/logo_rw01.b64").text.trim().decodeBase64()
    }
}
tasks.named("preBuild").configure { dependsOn("decodePamoyananLogo") }
